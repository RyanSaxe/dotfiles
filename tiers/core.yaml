# Deployment map for the core tier, executed by dotbot (see install.sh).
#
# Directives run in order: `create` makes the directories that receive
# generated files at runtime (so nothing can turn them into links into the
# repo), `clean` removes links whose repo file was renamed or deleted, and
# `link` deploys the tree.
#
# A config directory is linked WHOLE — one symlink, the repo directory behind
# it. A file added to the repo is then live immediately, with no deploy step
# between writing it and the program reading it. That is the default, and it
# is what makes this map safe to forget about.
#
# The exception is a directory a program WRITES into, which would turn its
# output into repo contents. Those get a real directory (`create` above) with
# the individual files linked inside it: bat and ghostty receive rendered
# themes and shaders, and ~/.local/bin is shared with everything else on the
# machine. The test for a new entry is "does anything write here", not "is it
# tidier one way".

- defaults:
    link:
      create: true
      relative: true
      relink: true

- create:
    - ~/.config/bat/themes
    - ~/.config/ghostty/shaders
    - ~/.config/ghostty/themes
    - ~/.local/bin

- clean:
    ~/:
      recursive: false
    ~/.config:
      recursive: true
    ~/.local/bin: {}

- link:
    ~/.zshrc: zsh/zshrc
    ~/.zshenv: zsh/zshenv
    # zshrc and zshenv are ALSO reachable at ~/.config/zsh/, which is
    # harmless: zsh reads the two above, and sources only `aliases.zsh` and
    # `functions/*.zsh` out of the directory.
    ~/.config/zsh: zsh
    ~/.config/git: git
    ~/.config/theme: theme
    ~/.config/nvim: nvim
    ~/.config/tmux: tmux
    ~/.config/workmux/config.yaml: workmux/config.yaml
    ~/.config/bat/config: bat/config
    ~/.config/vault/templates: clis/vault/templates
    ~/.local/bin/theme: theme/bin/theme
    ~/.local/bin/repo-size: clis/repo-size/repo-size.py
    ~/.local/bin/vault: clis/vault/vault.py
    ~/.local/bin/theme-picker: theme/bin/theme-picker
    ~/.local/bin/mascot-accents: theme/bin/mascot-accents.py
    ~/.local/bin/rail: tuis/rail/bin/rail
    ~/.local/bin/attention: tuis/rail/bin/attention
    ~/.local/bin/review-open: tuis/rail/bin/review-open
    ~/.local/bin/workmux-copy-ignored: workmux/bin/workmux-copy-ignored
    ~/.local/bin/workmux-escalate-idle: workmux/bin/workmux-escalate-idle
