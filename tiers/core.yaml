# Deployment map for the core tier, executed by dotbot (see install.sh).
#
# Directives run in order: `create` makes the directories that receive
# generated files at runtime (so nothing can turn them into links into the
# repo), `clean` removes links whose repo file was renamed or deleted, and
# `link` deploys per-file symlinks inside real directories.
#
# Globbed directories pick up new files automatically. Python's glob skips
# hidden files, so a dotted name inside a globbed tree needs its own explicit
# entry (as .luarc.json has); without one it silently never deploys.

- defaults:
    link:
      create: true
      relative: true
      relink: true

- create:
    - ~/.config/bat/themes
    - ~/.config/ghostty/shaders
    - ~/.config/ghostty/themes
    - ~/.local/bin

- clean:
    ~/:
      recursive: false
    ~/.config:
      recursive: true
    ~/.local/bin: {}

- link:
    ~/.zshrc: zsh/zshrc
    ~/.zshenv: zsh/zshenv
    ~/.config/zsh:
      glob: true
      path: zsh/**
      exclude: [zsh/zshrc, zsh/zshenv]
    ~/.config/git:
      glob: true
      path: git/**
    ~/.config/theme:
      glob: true
      path: theme/**
      exclude: [theme/bin/**]
    ~/.config/nvim:
      glob: true
      path: nvim/**
    ~/.config/nvim/.luarc.json: nvim/.luarc.json
    ~/.config/tmux:
      glob: true
      path: tmux/**
    ~/.config/workmux/config.yaml: workmux/config.yaml
    ~/.config/bat/config: bat/config
    ~/.local/bin/theme: theme/bin/theme
    ~/.local/bin/repo-size: clis/repo-size/repo-size
    ~/.local/bin/nvim-diagnostics: clis/nvim-diagnostics/nvim-diagnostics
    ~/.local/bin/theme-picker: theme/bin/theme-picker
    ~/.local/bin/mascot-accents: theme/bin/mascot-accents
    ~/.local/bin/rail: tuis/rail/bin/rail
    ~/.local/bin/attention: tuis/rail/bin/attention
    ~/.local/bin/review-open: tuis/rail/bin/review-open
    ~/.local/bin/workmux-copy-ignored: workmux/bin/workmux-copy-ignored
    ~/.local/bin/workmux-escalate-idle: workmux/bin/workmux-escalate-idle
