# Deployment map for the mac tier (see tiers/core.yaml for how this works).
# Cleaning ~/.config here as well keeps `./install.sh links mac` complete on
# its own; a second clean pass over the same directory is a no-op.

- defaults:
    link:
      create: true
      relative: true
      relink: true

- clean:
    ~/.config:
      recursive: true

- link:
    # ghostty stays per-file: `theme` renders shaders and themes into its
    # directory, so that one is real (see the `create` list in core.yaml).
    ~/.config/ghostty/config: ghostty/config
    ~/.config/sketchybar: sketchybar
    ~/.config/aerospace: aerospace
    # karabiner stays per-file: Karabiner-Elements writes GUI state and
    # automatic_backups/ into its directory, so the directory is real and
    # only the authored config is ours. It writes through the symlink, so
    # a GUI change shows up as a dirty repo file -- visible, not silent.
    ~/.config/karabiner/karabiner.json: karabiner/karabiner.json
