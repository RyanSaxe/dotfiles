# tmux configuration.
#
# Colors are NOT defined here: tmux-colors.conf is rendered by the `theme`
# command (palette + pokemon accents) and sourced below. Every style in
# this file references those @variables, so `theme` re-sourcing the colors
# file recolors the running server live — no restart, no reload.

# ----- terminal & environment ------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm-256color:RGB'
set -as terminal-features 'tmux-256color:RGB'
# Preserve COLORTERM so apps inside tmux (chalk, ink, etc.) emit 24-bit
# truecolor escapes instead of quantizing to 256 colors.
set-environment -g COLORTERM truecolor
# Belt-and-suspenders: force chalk's color level to truecolor directly.
set-environment -g FORCE_COLOR 3
# Claude Code checks LC_TERMINAL against a whitelist (ghostty/kitty/...)
# for advanced rendering; tmux normally hides the parent terminal.
set-environment -g LC_TERMINAL ghostty
set -g focus-events on
set -g escape-time 0
# Let applications' escape sequences (kitty graphics, OSC 52 clipboard)
# pass through tmux to the real terminal. Deliberately `on`, NOT `all`:
# with `all`, a HIDDEN pane (e.g. an nvim dashboard drawing its pokemon
# sprite) paints images over whatever window is actually visible.
set -g allow-passthrough on

# ----- prefix & basics -------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on

# Index windows and panes from 1 (easier keyboard reach).
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g history-limit 10000

# Size windows to the most recently active client, not the smallest one —
# a phone attaching to a session must not shrink the desktop's windows
# (and their rails) to phone dimensions.
set -g window-size latest

# ----- colors (generated) ----------------------------------------------
source-file -q ~/.local/state/dotfiles/generated/tmux-colors.conf

# Rounded powerline separators for the pill blocks.
set -g @left_rounded ""
set -g @right_rounded ""

# Set by the bell updater script; the session pill turns @notify when > 0.
set -g @bell_count 0

# ----- status bar ------------------------------------------------------
# Two rows at the top: row 0 holds the pills, row 1 is an empty padding
# row in the background color. The padding row also hosts the theme sync:
# every status-interval it re-sources the rendered colors if they changed,
# so theme/pokemon switches recolor tmux within 2s with no external push.
set-option -g status-position top
set -g status 2
# 2s matches the theme-sync convergence contract below at half the spawns.
set -g status-interval 2
set -g status-format[1] '#[bg=#{@bg}]#{p-200:}#(~/.config/tmux/scripts/theme-sync.sh)'

set -g status-style "fg=#{@fg},bg=#{@bg}"
set -g status-left-length 100
set -g status-right-length 100

# Window pills, fully native formats (no per-render shell).
# Inactive: dim throughout.
set -g window-status-style "fg=#{@fg},bg=#{@surface}"
set -g window-status-activity-style "fg=#{@warn},bg=#{@surface}"
set -g window-status-format "#[fg=#{@dim},bg=#{@bg}]#{@left_rounded}#[fg=#{@bg},bg=#{@dim},bold] #I #[fg=#{@dim},bg=#{@surface}]#[fg=#{@bg},bg=#{@dim}] #W #[fg=#{@dim},bg=#{@bg}]#{@right_rounded}#{?#{@workmux_status},#[bg=#{@bg}] #{E:@workmux_status},}"

# Active: number block in @accent, separator glyph in @notify, name on
# the surface color.
set -g window-status-current-style "fg=#{@fg},bg=#{@bg},bold"
set -g window-status-current-format "#[fg=#{@accent},bg=#{@bg}]#{@left_rounded}#[fg=#{@bg},bg=#{@accent},bold] #I #[fg=#{@notify},bg=#{@accent}]#[fg=#{@accent},bg=#{@surface},bold] #W #[fg=#{@surface},bg=#{@bg}]#{@right_rounded}#{?#{@workmux_status},#[bg=#{@bg}] #{E:@workmux_status},}"

# Session pill (right side). Pure tmux format so it evaluates per client.
# Color priority: prefix held (@accent) > pending bells (@notify) > @dim.
# #{=10:session_name} truncates to 10 characters.
set -g @session_block '#[fg=#{?client_prefix,#{@accent},#{?#{@bell_count},#{@notify},#{@dim}}},bg=#{@bg}]#{@left_rounded}#[fg=#{@bg},bg=#{?client_prefix,#{@accent},#{?#{@bell_count},#{@notify},#{@dim}}},bold] #{=10:session_name} #[fg=#{?client_prefix,#{@accent},#{?#{@bell_count},#{@notify},#{@dim}}},bg=#{@bg}]#{@right_rounded}'
set -g status-left ''
set -g status-right '#{E:@session_block}'

# Panes, messages, copy-mode.
# Auto separators: crust hairlines appear only in windows holding 2+
# content panes (@wborders, maintained by scripts/update-window-borders
# via hooks below + the rail daemon's reconcile). Single-content windows
# stay line-free, so the rail seam is a pure color boundary. Active and
# normal share one style: tmux hands shared borders to the active pane's
# style, so any difference paints moving lines. The channel's bg stays
# default (base) — it reads as air beside content.
set -g pane-border-style '#{?#{@wborders},fg=#{@crust},fg=#{@bg}}'
set -g pane-active-border-style '#{?#{@wborders},fg=#{@crust},fg=#{@bg}}'
set -g message-style "fg=#{@fg},bg=#{@bg_alt}"
set -g message-command-style "fg=#{@fg},bg=#{@bg_alt}"
set -g window-status-bell-style "fg=#{@notify},bg=#{@bg}"
set -g mode-style "fg=#{@fg},bg=#{@border}"

# ----- key bindings ----------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Smart pane switching aware of vim splits (hand-written vim-tmux-navigator
# binds; no plugin needed).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
# C-h skips the rail: the sidebar pane is display-only, so landing on it
# bounces straight back to the content pane.
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L; if -F "#{@rail}" "select-pane -R"'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Vim-style scrolling: pass through to vim, otherwise enter copy-mode.
# -e auto-exits copy-mode at the bottom. Full page (C-b/f) and half page
# (C-u/d) both bound for controlled scrolling.
bind-key -n 'C-b' if-shell "$is_vim" 'send-keys C-b' 'copy-mode -eu'
bind-key -n 'C-f' if-shell "$is_vim" 'send-keys C-f' 'copy-mode -e; send-keys C-f'
bind-key -n 'C-u' if-shell "$is_vim" 'send-keys C-u' 'copy-mode -e; send-keys C-u'
bind-key -n 'C-d' if-shell "$is_vim" 'send-keys C-d' 'copy-mode -e; send-keys C-d'

# tmux defaults displaced by the vim binds above.
bind l last-window
bind L switch-client -l

# Splits and windows inherit the current path.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# Mouse wheel: send to mouse-aware apps, otherwise scroll copy-mode.
# Rail panes are display-only — wheel events over them do nothing (copy
# mode there would show a scroll position over the sidebar).
bind -n WheelUpPane if-shell -F -t = "#{@rail}" "" "if -Ft= '#{mouse_any_flag}' 'send-keys -M' \"if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'\""
bind -n WheelDownPane if-shell -F -t = "#{@rail}" "" "select-pane -t=; send-keys -M"

# Vi copy mode.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'C-h' select-pane -L \; if -F "#{@rail}" "select-pane -R"
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ----- pane history: go back to the previous pane, across sessions ------
# track-pane.sh records focus changes (deduplicated, background so the UI
# stays responsive); go-back-pane.sh jumps to the previous entry.
set-hook -g after-select-pane 'run-shell -b "~/.config/tmux/scripts/track-pane.sh"'
set-hook -g session-window-changed 'run-shell -b "~/.config/tmux/scripts/track-pane.sh"'
set-hook -g client-session-changed 'run-shell -b "~/.config/tmux/scripts/track-pane.sh"'
bind -n M-l run-shell '~/.config/tmux/scripts/go-back-pane.sh'

# `exit` in a shell pane kills that pane but leaves its window alive if a
# rail pane is still in it; tmux stretches the display-only rail across
# the whole window until the daemon's next tick reaps it, flickering. Reap
# on the spot instead — the daemon's selfHeal remains the backstop.
set-hook -g pane-exited 'run-shell -b "~/.config/tmux/scripts/reap-rail-window.sh #{window_id}"'
# Auto separators follow pane count instantly (see the border styles).
set-hook -ga pane-exited 'run-shell -b "~/.config/tmux/scripts/update-window-borders.sh #{window_id}"'
set-hook -g after-split-window 'run-shell -b "~/.config/tmux/scripts/update-window-borders.sh #{window_id}"'
# ----- window navigation on the alt layer ------------------------------
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-q detach-client
bind-key -n M-n new-window

# Session/repo pickers as popups (TMUX_POPUP marks popup shells; see zshrc).
bind-key s display-popup -E "TMUX_POPUP=1 zsh -ic ts"
bind-key o display-popup -E "TMUX_POPUP=1 zsh -ic to"
bind-key a display-popup -E "TMUX_POPUP=1 zsh -ic tai"
bind-key b display-popup -E "TMUX_POPUP=1 zsh -ic tb"
bind-key -n M-s display-popup -E "TMUX_POPUP=1 zsh -ic ts"
bind-key -n M-o display-popup -E "TMUX_POPUP=1 zsh -ic to"
bind-key -n M-a display-popup -E "TMUX_POPUP=1 zsh -ic tai"
bind-key -n M-b display-popup -E "TMUX_POPUP=1 zsh -ic tb"

# Theme picker (mode, pokemon, scope) as a popup.
bind-key -n M-c display-popup -E "TMUX_POPUP=1 zsh -ic theme-picker"

# Agent fleet: dashboard popup and attention jump (newest done/waiting).
bind-key -n M-d display-popup -h 80% -w 90% -E "workmux dashboard"
bind-key -n M-j run-shell -b "workmux last-done"

# ----- the rail (tuis/rail) --------------------------------------------
# In-terminal sidebar: a display-only pane per window painted by one
# daemon. The daemon is the SOLE creator of rail panes (a second spawner
# would race it and duplicate them): while enabled, it grows a rail in
# every window and reaps orphans within a tick.
bind-key -n M-g run-shell -b "\"$HOME/.local/bin/rail\" toggle"
# Page the rail body when it overflows (the rail shows these keys in its
# footer pagination hint).
bind-key -n M-, run-shell -b "\"$HOME/.local/bin/rail\" page up"
bind-key -n M-. run-shell -b "\"$HOME/.local/bin/rail\" page down"
if-shell '[ -f ~/.local/state/dotfiles/rail/enabled ]' \
  'run-shell -b "~/.local/bin/rail ensure-daemon"'
# The status bar is off, period: the rail carries the chrome, and alt+g
# with the rail hidden means FOCUS MODE — no chrome at all, navigation
# stays on the alt binds. (The pill formats above still render the bar if
# status is ever turned on manually; their deletion is queued for the
# keybind session.)
set -g status off

# Jump hints: alt+; enters the rail key table for exactly one key; the
# letter shown as a chip on an agent row jumps to that agent's pane.
bind-key -n 'M-;' switch-client -T rail
bind-key -T rail a run-shell "~/.local/bin/rail jump a"
bind-key -T rail b run-shell "~/.local/bin/rail jump b"
bind-key -T rail c run-shell "~/.local/bin/rail jump c"
bind-key -T rail d run-shell "~/.local/bin/rail jump d"
bind-key -T rail e run-shell "~/.local/bin/rail jump e"
bind-key -T rail f run-shell "~/.local/bin/rail jump f"
bind-key -T rail g run-shell "~/.local/bin/rail jump g"
bind-key -T rail h run-shell "~/.local/bin/rail jump h"
bind-key -T rail i run-shell "~/.local/bin/rail jump i"
bind-key -T rail j run-shell "~/.local/bin/rail jump j"
bind-key -T rail k run-shell "~/.local/bin/rail jump k"
bind-key -T rail l run-shell "~/.local/bin/rail jump l"
bind-key -T rail m run-shell "~/.local/bin/rail jump m"
bind-key -T rail n run-shell "~/.local/bin/rail jump n"
bind-key -T rail o run-shell "~/.local/bin/rail jump o"
bind-key -T rail p run-shell "~/.local/bin/rail jump p"
bind-key -T rail q run-shell "~/.local/bin/rail jump q"
bind-key -T rail r run-shell "~/.local/bin/rail jump r"
bind-key -T rail s run-shell "~/.local/bin/rail jump s"
bind-key -T rail t run-shell "~/.local/bin/rail jump t"
bind-key -T rail u run-shell "~/.local/bin/rail jump u"
bind-key -T rail v run-shell "~/.local/bin/rail jump v"
bind-key -T rail w run-shell "~/.local/bin/rail jump w"
bind-key -T rail x run-shell "~/.local/bin/rail jump x"
bind-key -T rail y run-shell "~/.local/bin/rail jump y"
bind-key -T rail z run-shell "~/.local/bin/rail jump z"
bind-key -T rail Escape switch-client -T root

# ----- background daemons (legacy) -------------------------------------
# TODO: this whole block still runs out of the legacy dotfiles repo. The
# notification/attention system is being redesigned around workmux; these
# daemons and their absolute paths go away with that redesign.

# Kill old updater instances before starting new ones (prevents duplicates
# on reload). SIGKILL because SIGTERM doesn't interrupt bash sleep; locks
# force-removed since SIGKILL bypasses cleanup traps.
run-shell 'pkill -9 -f "tmux/scripts/color-cache-updater.sh" || true; pkill -9 -f "tmux/scripts/bell-cache-updater.sh" || true; pkill -9 -f "tmux/scripts/github-comments-daemon.sh" || true; pkill -9 -f "ai-harness/scripts/attention-daemon.sh" || true; rm -rf ~/.cache/tmux-*-updater.lock ~/.cache/tmux-github-comments-daemon.lock ~/.cache/ai-harness/tmux-attention-daemon.lock 2>/dev/null || true; sleep 0.2'

run-shell -b '~/generic/dotfiles/tmux/scripts/bell-cache-updater.sh >/dev/null 2>&1 &'
run-shell -b '~/generic/dotfiles/tmux/scripts/github-comments-daemon.sh >/dev/null 2>&1 &'
run-shell -b 'bash ~/generic/dotfiles/ai-harness/scripts/attention-daemon.sh >/dev/null 2>&1 &'

# GitHub comment review session: lives in the notes vault; the daemon above
# rings its bell when threads need attention.
if-shell '! tmux has-session -t code-review 2>/dev/null' \
  'new-session -d -s code-review -c ~/generic/notes -n review "~/generic/dotfiles/tmux/scripts/github-comments-interactive.sh"'

# ----- hygiene ---------------------------------------------------------
# Neovim 0.9+ spawns a child "nvim --embed" for RPC; killing the TUI
# abruptly (closing a pane) orphans it (PPID=1). Reap orphans on session
# close.
set-hook -g session-closed 'run-shell "ps -eo pid,ppid,command | awk '\''/nvim --embed/ && $2==1 {print $1}'\'' | xargs kill 2>/dev/null || true"'
