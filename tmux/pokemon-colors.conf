# Pokemon Color Overrides for Tmux
# Configure manual overrides for pokemon-themed colors
# Leave empty ("") to use colors from pokemon (generated by Neovim dashboard)
# Set to a hex color to always use that color regardless of pokemon

# Dim color: Used for inactive windows and borders
# Default pokemon behavior: Uses pokemon's dim/muted color
POKEMON_COLOR_DIM_OVERRIDE=""

# Prominent color: Used for active window highlighting
# Default pokemon behavior: Uses pokemon's most prominent/vibrant color
POKEMON_COLOR_PROMINENT_OVERRIDE=""

# Bright color: Used for notifications, session block, and accent highlights
# Default pokemon behavior: Uses pokemon's bright/contrasting color
POKEMON_COLOR_BRIGHT_OVERRIDE=""

# Examples:
# Force dim to always be TokyoNight gray:
#   POKEMON_COLOR_DIM_OVERRIDE="#565f89"
#
# Force bright to always be orange:
#   POKEMON_COLOR_BRIGHT_OVERRIDE="#ff9e64"
#
# Use pokemon colors for everything:
#   (leave all three empty as shown above)
