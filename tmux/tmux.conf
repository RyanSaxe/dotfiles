# ==========================
# TMUX Configuration
# ==========================

# Basic Settings
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm-256color:RGB'
set -as terminal-features 'tmux-256color:RGB'
set -g focus-events on
set -g escape-time 0

# Unbind the old prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# Enable mouse support for easier interaction
set -g mouse on

# Start indexing at 1 for windows and panes (easier to reach on keyboard)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# Status bar at the top with empty padding row below
set-option -g status-position top
set -g status 2
set -g status-format[1] '#[bg=#{@tokyonight_bg}]#{p-200:}'


# ==========================
# Key Bindings
# ==========================

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Smart pane switching with awareness of Vim splits (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# ════════════════════════════════════════════════════════════════════════════
# Vim-style Scrolling (pass through to nvim, otherwise enter copy-mode)
# ════════════════════════════════════════════════════════════════════════════
# In nvim: native behavior preserved (including plugin overrides like snacks picker)
# In shell/tmux: enters copy-mode and scrolls using vi copy-mode keys
# The -e flag auto-exits copy-mode when scrolling back to bottom (0/x position)
# Having both full-page (C-b/f) and half-page (C-u/d) enables smooth, controlled scrolling
bind-key -n 'C-b' if-shell "$is_vim" 'send-keys C-b' 'copy-mode -eu'
bind-key -n 'C-f' if-shell "$is_vim" 'send-keys C-f' 'copy-mode -e; send-keys C-f'
bind-key -n 'C-u' if-shell "$is_vim" 'send-keys C-u' 'copy-mode -e; send-keys C-u'
bind-key -n 'C-d' if-shell "$is_vim" 'send-keys C-d' 'copy-mode -e; send-keys C-d'

# Restore tmux defaults for last window/pane (vim nav is Ctrl+hjkl above)
bind l last-window

# ════════════════════════════════════════════════════════════════════════════
# Pane History: "Go Back" to Previous Pane (across sessions)
# ════════════════════════════════════════════════════════════════════════════

# Track pane focus changes for "go back" functionality
# Script has deduplication logic - safe if multiple hooks fire for one action
# Runs in background (-b) so UI stays responsive
# Format stored: "session_name:window_index.pane_index"
set-hook -g after-select-pane 'run-shell -b "~/.config/tmux/scripts/track-pane.sh"'
set-hook -g session-window-changed 'run-shell -b "~/.config/tmux/scripts/track-pane.sh"'
set-hook -g client-session-changed 'run-shell -b "~/.config/tmux/scripts/track-pane.sh"'

# Restore tmux default: prefix+L = last session
bind L switch-client -l

# Go back to previous pane (works across sessions) - Alt+l
bind -n M-l run-shell '~/.config/tmux/scripts/go-back-pane.sh'

# Better window splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Easy scrolling in copy mode
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Vi mode for copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# tmux-navigator copy mode integration
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ==========================
# Theme: TokyoNight Night
# ==========================

# Colors (TokyoNight Night palette with Pokemon theme integration)
# Pokemon-themed colors are dynamically loaded via scripts (like notification_color)
# Colors come from: ~/.cache/pokemon-colors.env (generated by Neovim dashboard)
# Overrides can be set in: ~/.config/tmux/pokemon-colors.conf
# Falls back to TokyoNight defaults if cache doesn't exist

# Static TokyoNight colors (not pokemon-themed)
set -g @tokyonight_bg "#16161e"  # Changed to match Neovim's c.bg_dark
set -g @tokyonight_fg "#c0caf5"
set -g @tokyonight_green "#9ece6a"
set -g @tokyonight_red "#f7768e"
set -g @tokyonight_yellow "#e0af68"
set -g @tokyonight_pink "#f7768e"
set -g @tokyonight_dark "#15161e"
set -g @tokyonight_fg_gutter "#3b4261"
set -g @tokyonight_cyan "#7dcfff"
set -g @tokyonight_blue "#7aa2f7"
set -g @tokyonight_orange "#ff9e64"
set -g @tokyonight_visual "#283457"  # Visual selection (matches Neovim TokyoNight)

# Pokemon-themed colors (cached by color-cache-updater.sh background script)
# These colors change based on the pokemon displayed in Neovim dashboard
# Variables are set by color-cache-updater.sh: @pokemon_dim, @pokemon_prominent, @pokemon_bright
# This prevents expensive script calls on every status bar render
# Default values ensure variables exist before cache updater runs (prevents empty colors on first load)
set -g @pokemon_dim "#565f89"
set -g @pokemon_prominent "#7aa2f7"
set -g @pokemon_bright "#ff9e64"
set -g @bell_count 0

# Rounded powerline separators for blocks
set -g @left_rounded ""
set -g @right_rounded ""

# Status bar style
set -g status-style "fg=#{@tokyonight_fg},bg=#{@tokyonight_bg}"
set -g status-left-length 100
set -g status-right-length 100

# Window status with rounded blocks - inactive windows
set -g window-status-style "fg=#{@tokyonight_fg},bg=#{@tokyonight_fg_gutter}"
set -g window-status-activity-style "fg=#{@tokyonight_yellow},bg=#{@tokyonight_fg_gutter}"

# Window status with rounded blocks - active window (colors set in format string)
# This is just a fallback style - actual colors come from window-status-current-format
set -g window-status-current-style "fg=#{@tokyonight_fg},bg=#{@tokyonight_bg},bold"

# Window status format - complete formatted blocks built by script (mirrors session-block.sh pattern)
# This ensures all color calls happen in one script execution, preventing inconsistency
# Inactive: pokemon dim color for all elements
set -g window-status-format "#(~/.config/tmux/scripts/window-status-block.sh inactive)"

# Active: pokemon prominent for number and window name, pokemon bright for separator
set -g window-status-current-format "#(~/.config/tmux/scripts/window-status-block.sh active)"

# Pane border (using static TokyoNight colors - pokemon colors applied elsewhere)
set -g pane-border-style "fg=#{@tokyonight_fg_gutter}"
set -g pane-active-border-style "fg=#{@tokyonight_blue}"

# Message style - using cyan for warnings and notifications
set -g message-style "fg=#{@tokyonight_fg},bg=#{@tokyonight_dark}"
set -g message-command-style "fg=#{@tokyonight_fg},bg=#{@tokyonight_dark}"
# Activity and bell notification styles (using static colors)
set -g window-status-bell-style "fg=#{@tokyonight_orange},bg=#{@tokyonight_bg}"

# Mode style (copy mode, etc.) - Matches Neovim TokyoNight visual selection
# Uses exact same color as Neovim's Visual mode (#283457)
set -g mode-style "fg=#{@tokyonight_fg},bg=#{@tokyonight_visual}"
# Define your styled blocks with time color that changes for meeting reminders

# Session name block - pure tmux format for correct per-client evaluation
# Previous version used #() shell command which was evaluated globally, causing wrong session names
# when multiple terminals were attached to the same session
# Color priority: prefix (prominent) > bells (bright) > default (dim)
# Note: #{=10:session_name} truncates session name to 10 characters (no ellipsis for simplicity)
set -g @left_block '#[fg=#{?client_prefix,#{@pokemon_prominent},#{?#{@bell_count},#{@pokemon_bright},#{@pokemon_dim}}},bg=#{@tokyonight_bg}]#{@left_rounded}#[fg=#{@tokyonight_bg},bg=#{?client_prefix,#{@pokemon_prominent},#{?#{@bell_count},#{@pokemon_bright},#{@pokemon_dim}}},bold] #{=10:session_name} #[fg=#{?client_prefix,#{@pokemon_prominent},#{?#{@bell_count},#{@pokemon_bright},#{@pokemon_dim}}},bg=#{@tokyonight_bg}]#{@right_rounded}'

# Bell notification configuration - simple orange indicator when notifications exist

# Right block: session name (moved from left side)
set -g @right_block '#{E:@left_block}'
# Status layout: empty left, session name on right
set -g status-left  ''
set -g status-right '#{E:@right_block}'
# ==========================
# Window Navigation
# ==========================

# alt as an alternative to prefix for some common actions
#
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind-key -n M-q detach-client
bind-key -n M-n new-window


bind-key s display-popup -E "TMUX_POPUP=1 zsh -ic ts"
bind-key o display-popup -E "TMUX_POPUP=1 zsh -ic to"
bind-key a display-popup -E "TMUX_POPUP=1 zsh -ic tai"
bind-key b display-popup -E "TMUX_POPUP=1 zsh -ic tb"
bind-key -n M-s display-popup -E "TMUX_POPUP=1 zsh -ic ts"
bind-key -n M-o display-popup -E "TMUX_POPUP=1 zsh -ic to"
bind-key -n M-a display-popup -E "TMUX_POPUP=1 zsh -ic tai"
bind-key -n M-b display-popup -E "TMUX_POPUP=1 zsh -ic tb"


# Kill old updater scripts before starting new ones (prevents duplicates on reload)
# Use SIGKILL (-9) because SIGTERM doesn't interrupt bash sleep properly
# Force remove locks since SIGKILL bypasses cleanup traps
run-shell 'pkill -9 -f "tmux/scripts/color-cache-updater.sh" || true; pkill -9 -f "tmux/scripts/bell-cache-updater.sh" || true; pkill -9 -f "tmux/scripts/github-comments-daemon.sh" || true; pkill -9 -f "ai-harness/tmux/attention-daemon.sh" || true; rm -rf ~/.cache/tmux-*-updater.lock ~/.cache/tmux-github-comments-daemon.lock ~/.cache/ai-harness/tmux-attention-daemon.lock 2>/dev/null || true; sleep 0.2'

# Clean up orphaned nvim --embed processes when sessions close
# Neovim 0.9+ spawns a child "nvim --embed" process for RPC. When the parent nvim TUI
# is killed abruptly (e.g., closing tmux pane), the child becomes orphaned (PPID=1).
# This hook kills those orphans to prevent memory/CPU waste.
# Safe because: active nvim processes have their TUI parent alive (PPID != 1)
set-hook -g session-closed 'run-shell "ps -eo pid,ppid,command | awk '\''/nvim --embed/ && $2==1 {print $1}'\'' | xargs kill 2>/dev/null || true"'

# Start background updater scripts (single instance guarded by PID locks)
# These cache expensive computations in tmux variables to prevent script spam on every render
run-shell -b '~/.config/tmux/scripts/color-cache-updater.sh >/dev/null 2>&1 &'
run-shell -b '~/.config/tmux/scripts/bell-cache-updater.sh >/dev/null 2>&1 &'
run-shell -b '~/.config/tmux/scripts/github-comments-daemon.sh >/dev/null 2>&1 &'
run-shell -b 'bash ~/generic/dotfiles/ai-harness/tmux/attention-daemon.sh >/dev/null 2>&1 &'

# Create code-review session for GitHub comment review workflow
# - Runs in ~/generic/notes (Obsidian vault) for easy note-taking during review
# - Interactive script shows thread count and opens Neovim picker on Enter
# - Daemon sends bells here when threads need attention (works even if Neovim is open)
if-shell '! tmux has-session -t code-review 2>/dev/null' \
  'new-session -d -s code-review -c ~/generic/notes -n review "~/.config/tmux/scripts/github-comments-interactive.sh"'

# ==========================
# Plugin Configuration (for future tmux-navigator setup)
# ==========================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
