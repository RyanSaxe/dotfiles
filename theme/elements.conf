# Rendered output -> palette context. Five contexts exist: inner and outer
# follow the matching layer mode, mixed gets both namespaces and must
# qualify every placeholder as {{inner_*}} / {{outer_*}}, and dark and light
# pin a render to one mode regardless of either layer — ghostty reads its
# light: and dark: theme pair simultaneously, so both must always exist.
cursor_trail.glsl=inner
frame.glsl=outer
shell-colors.zsh=inner
fast-syntax-highlighting.ini=inner
sketchybar-colors.sh=outer
starship.toml=inner
ai-statusline-colors.js=inner
tmux-colors.conf=mixed
tuis-colors.json=outer
Dotfiles.tmTheme=inner
nvim-tokens.lua=mixed
dotfiles-dark=dark
dotfiles-light=light
