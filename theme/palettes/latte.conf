# Light palette: Catppuccin Latte accents on this repo's own warm neutral
# ramp. Latte's neutrals were replaced deliberately — its text/base
# contrast (7.06) is far below Mocha's (11.34), too dim for a light mode
# whose whole job is readability. The ramp below holds Mocha-level
# contrast (text/base 11.27) on a warm paper ground. The accent hues and
# role assignments are untouched; see mocha.conf for the identity note.
mode=light
