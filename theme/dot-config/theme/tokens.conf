# Layer 2: semantic roles mapped to palette keys. This is the stable layer —
# apps and templates reference roles, never palette keys or hex values.
# The mascot accent (theme mascot <provider:id>) overrides accent/notify only;
# everything else is untouchable by design.
bg=base
bg_alt=mantle
bg_highlight=surface0
fg=text
fg_muted=subtext0
fg_faint=overlay0
border=surface1
accent=mauve
notify=peach
warn=yellow
success=green
info=blue
ghost=overlay0
# Agent status semantics — deliberately palette keys, never the mascot
# accents; every renderer of agent state (tmux, rail) reads these.
status_working=mauve
status_waiting=peach
status_done=green
