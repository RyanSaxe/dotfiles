# Per-project pokemon. Consulted on workspace switches (the mascot daemon
# and `to`); `theme pokemon <name>` always overrides manually.
#
#   <project-name>=<pokemon>   project-specific (matches workspace basename)
#   default=<pokemon>          used when a project has no entry
#
# Without a default, unmapped projects keep whatever is currently active.
# default=gengar
# dotfiles=charizard
