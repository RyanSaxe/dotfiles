# Layer 2: semantic roles mapped to palette keys. This is the stable layer —
# apps and templates reference roles, never palette keys or hex values.
# The pokemon accent (theme pokemon <name>) overrides accent/accent_bright
# only; everything else is untouchable by design.
bg=base
bg_alt=mantle
bg_highlight=surface0
fg=text
fg_muted=subtext0
fg_faint=overlay0
border=surface1
accent=mauve
accent_bright=peach
error=red
warn=yellow
success=green
info=blue
ghost=overlay0
diff_add=green
diff_delete=red
diff_change=yellow
