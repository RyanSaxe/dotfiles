<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Risk Slide - Launch Mitigation</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../shared.css">
<style>
.risk-map {
  position: relative;
  height: 510px;
}

.risk-map svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.risk-node,
.mitigation-node {
  position: absolute;
  width: 260px;
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 14px;
  align-items: start;
}

.risk-node { left: 0; }
.mitigation-node { right: 0; }

.risk-node.one,
.mitigation-node.one { top: 44px; }
.risk-node.two,
.mitigation-node.two { top: 214px; }
.risk-node.three,
.mitigation-node.three { top: 374px; }

.node-dot {
  width: 28px;
  height: 28px;
  border: 3px solid var(--ink);
  border-radius: 50%;
  margin-top: 6px;
}

.risk-node .node-dot { background: var(--red); }
.mitigation-node .node-dot { background: var(--green); }

.risk-node h2,
.mitigation-node h2 {
  font-size: 30px;
  line-height: 1;
}

.risk-node span,
.mitigation-node span {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 820;
  text-transform: uppercase;
}

.launch-control {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 180px;
  height: 180px;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: var(--amber);
  display: grid;
  place-items: center;
  text-align: center;
  font-size: 26px;
  line-height: 1;
  font-weight: 850;
  transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<main class="stage">
  <div class="slide-frame">
    <section class="slide content-slide">
      <header class="slide-title">
        <h1>Launch risks have mitigations.</h1>
      </header>
      <div class="risk-map" aria-label="Three launch risks connected to mitigations through launch control">
        <svg viewBox="0 0 1152 510" aria-hidden="true">
          <path d="M276 78 C408 78 430 192 492 248" fill="none" stroke="#d75f46" stroke-width="6" stroke-linecap="round"></path>
          <path d="M276 248 C380 248 428 248 492 248" fill="none" stroke="#d75f46" stroke-width="6" stroke-linecap="round"></path>
          <path d="M276 408 C406 408 432 314 492 248" fill="none" stroke="#d75f46" stroke-width="6" stroke-linecap="round"></path>
          <path d="M660 248 C724 190 764 78 876 78" fill="none" stroke="#4f8061" stroke-width="6" stroke-linecap="round"></path>
          <path d="M660 248 C742 248 792 248 876 248" fill="none" stroke="#4f8061" stroke-width="6" stroke-linecap="round"></path>
          <path d="M660 248 C724 314 760 408 876 408" fill="none" stroke="#4f8061" stroke-width="6" stroke-linecap="round"></path>
        </svg>
        <div class="risk-node one"><div class="node-dot"></div><div><h2>Support spike</h2><span>high probability</span></div></div>
        <div class="risk-node two"><div class="node-dot"></div><div><h2>Latency regression</h2><span>medium probability</span></div></div>
        <div class="risk-node three"><div class="node-dot"></div><div><h2>Partner readiness</h2><span>medium probability</span></div></div>
        <div class="launch-control">Launch<br>control</div>
        <div class="mitigation-node one"><div class="node-dot"></div><div><h2>Launch queue</h2><span>owner assigned</span></div></div>
        <div class="mitigation-node two"><div class="node-dot"></div><div><h2>Rollback threshold</h2><span>metric live</span></div></div>
        <div class="mitigation-node three"><div class="node-dot"></div><div><h2>Readiness checklist</h2><span>two gaps open</span></div></div>
      </div>
    </section>
  </div>
</main>
<script src="../shared.js"></script>
</body>
</html>
