<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metric Slide - Monthly KPI Summary</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../shared.css">
<style>
.kpi-board {
  align-self: center;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 34px 46px;
}

.kpi-tile {
  min-height: 210px;
  border-top: 4px solid var(--ink);
  padding-top: 22px;
  display: grid;
  grid-template-columns: 0.72fr 1fr;
  gap: 24px;
  align-items: center;
}

.kpi-value {
  display: grid;
  gap: 10px;
}

.kpi-name {
  color: var(--muted);
  font-size: 15px;
  font-weight: 850;
  text-transform: uppercase;
}

.kpi-value strong {
  font-size: 64px;
  line-height: 0.9;
}

.kpi-value span {
  color: var(--muted);
  font-size: 16px;
  font-weight: 760;
}

.kpi-detail {
  display: grid;
  gap: 16px;
}

.delta {
  width: max-content;
  border: 2px solid var(--ink);
  background: #d9e5d6;
  padding: 7px 12px;
  font-size: 14px;
  font-weight: 850;
}

.delta.down {
  background: #f4d7cf;
}

.bar-set {
  display: grid;
  gap: 12px;
}

.bar-row {
  display: grid;
  gap: 6px;
}

.bar-label {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px;
  font-weight: 850;
  text-transform: uppercase;
}

.bar-track {
  height: 17px;
  border: 2px solid var(--ink);
  background: var(--surface-2);
}

.bar-fill {
  height: 100%;
  background: var(--amber);
}

.bar-fill.current {
  background: var(--green);
}

.bar-fill.red {
  background: var(--red);
}
</style>
</head>
<body>
<main class="stage">
  <div class="slide-frame">
    <section class="slide content-slide">
      <header class="slide-title">
        <h1>Monthly KPI summary</h1>
      </header>
      <div class="kpi-board" aria-label="Monthly KPI summary comparing current values to last month">
        <div class="kpi-tile">
          <div class="kpi-value"><div class="kpi-name">Revenue</div><strong>$4.8M</strong><span>last month $4.5M</span></div>
          <div class="kpi-detail">
            <div class="delta">+$0.3M</div>
            <div class="bar-set">
              <div class="bar-row"><div class="bar-label"><span>last</span><span>$4.5M</span></div><div class="bar-track"><div class="bar-fill" style="width: 75%;"></div></div></div>
              <div class="bar-row"><div class="bar-label"><span>now</span><span>$4.8M</span></div><div class="bar-track"><div class="bar-fill current" style="width: 80%;"></div></div></div>
            </div>
          </div>
        </div>
        <div class="kpi-tile">
          <div class="kpi-value"><div class="kpi-name">Conversion</div><strong>7.4%</strong><span>last month 6.9%</span></div>
          <div class="kpi-detail">
            <div class="delta">+0.5 pts</div>
            <div class="bar-set">
              <div class="bar-row"><div class="bar-label"><span>last</span><span>6.9%</span></div><div class="bar-track"><div class="bar-fill" style="width: 69%;"></div></div></div>
              <div class="bar-row"><div class="bar-label"><span>now</span><span>7.4%</span></div><div class="bar-track"><div class="bar-fill current" style="width: 74%;"></div></div></div>
            </div>
          </div>
        </div>
        <div class="kpi-tile">
          <div class="kpi-value"><div class="kpi-name">Activation</div><strong>62%</strong><span>last month 58%</span></div>
          <div class="kpi-detail">
            <div class="delta">+4 pts</div>
            <div class="bar-set">
              <div class="bar-row"><div class="bar-label"><span>last</span><span>58%</span></div><div class="bar-track"><div class="bar-fill" style="width: 58%;"></div></div></div>
              <div class="bar-row"><div class="bar-label"><span>now</span><span>62%</span></div><div class="bar-track"><div class="bar-fill current" style="width: 62%;"></div></div></div>
            </div>
          </div>
        </div>
        <div class="kpi-tile">
          <div class="kpi-value"><div class="kpi-name">Retention</div><strong>91%</strong><span>last month 93%</span></div>
          <div class="kpi-detail">
            <div class="delta down">-2 pts</div>
            <div class="bar-set">
              <div class="bar-row"><div class="bar-label"><span>last</span><span>93%</span></div><div class="bar-track"><div class="bar-fill" style="width: 93%;"></div></div></div>
              <div class="bar-row"><div class="bar-label"><span>now</span><span>91%</span></div><div class="bar-track"><div class="bar-fill red" style="width: 91%;"></div></div></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="../shared.js"></script>
</body>
</html>
