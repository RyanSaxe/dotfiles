<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metric Slide - Conversion KPI</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../shared.css">
<style>
.metric-layout {
  display: grid;
  grid-template-columns: 0.78fr 1.22fr;
  gap: 48px;
  align-items: stretch;
}

.hero-metric {
  border-top: 4px solid var(--ink);
  padding-top: 28px;
  display: grid;
  align-content: start;
  gap: 18px;
}

.hero-metric strong {
  font-size: 142px;
  line-height: 0.86;
}

.hero-metric span {
  color: var(--muted);
  font-size: 20px;
  font-weight: 780;
  text-transform: uppercase;
}

.chart-card {
  border: 2px solid var(--ink);
  background: var(--surface);
  padding: 34px;
  display: grid;
  grid-template-rows: 1fr auto;
  gap: 26px;
}

.chart {
  width: 100%;
  height: 100%;
}

.chart-labels {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 13px;
  font-weight: 850;
  text-transform: uppercase;
}
</style>
</head>
<body>
<main class="stage">
  <div class="slide-frame">
    <section class="slide content-slide">
      <header class="slide-title">
        <p class="kicker">kpi deep dive</p>
        <h1>Checkout conversion recovered after retry routing.</h1>
      </header>
      <div class="metric-layout" aria-label="Conversion metric with trend line">
        <div class="hero-metric"><strong>+4.8</strong><span>points vs. launch week</span></div>
        <div class="chart-card">
          <svg class="chart" viewBox="0 0 640 320" aria-hidden="true">
            <path d="M40 270 H600 M40 205 H600 M40 140 H600 M40 75 H600" fill="none" stroke="#d7d2c8" stroke-width="2"/>
            <path d="M42 238 C100 232 126 225 168 216 C224 205 250 178 302 166 C370 150 408 112 456 98 C510 82 552 76 596 70" fill="none" stroke="#2f6f89" stroke-width="8"/>
            <path d="M42 252 C134 248 218 242 302 232 C398 218 496 204 596 188" fill="none" stroke="#d75f46" stroke-width="6" opacity="0.6"/>
            <circle cx="302" cy="166" r="12" fill="#e9b949" stroke="#111418" stroke-width="3"/>
          </svg>
          <div class="chart-labels"><span>launch</span><span>retry routing</span><span>current</span></div>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="../shared.js"></script>
</body>
</html>
