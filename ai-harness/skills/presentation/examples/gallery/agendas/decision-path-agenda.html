<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agenda Slide - Decision Path</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../shared.css">
<style>
.agenda-slide {
  grid-template-columns: 0.84fr 1.16fr;
  gap: 58px;
  align-items: center;
}

.agenda-title {
  display: grid;
  gap: 20px;
}

.agenda-title h1 {
  max-width: 10ch;
  font-size: 92px;
  line-height: 0.98;
  font-weight: 850;
}

.agenda-title p {
  max-width: 30ch;
  color: var(--muted);
  font-size: 23px;
  line-height: 1.28;
  font-weight: 620;
}

.path {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
}

.agenda-items {
  position: relative;
  display: grid;
  grid-template-rows: repeat(4, 1fr);
}

.agenda-items:before {
  content: "";
  position: absolute;
  left: 17px;
  top: 19px;
  bottom: calc((100% / 4) - 19px);
  width: 3px;
  background: var(--ink);
}

.agenda-item {
  display: grid;
  grid-template-columns: 38px 1fr;
  gap: 22px;
  min-height: 112px;
}

.agenda-item b {
  z-index: 1;
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 2px solid var(--ink);
  border-radius: 50%;
  background: var(--bg);
  font-size: 16px;
}

.agenda-item.current b {
  background: var(--amber);
}

.agenda-item h2 {
  margin: 0;
  font-size: 34px;
  line-height: 1.03;
}

.agenda-item p {
  margin-top: 8px;
  max-width: 42ch;
  color: var(--muted);
  font-size: 17px;
  line-height: 1.35;
  font-weight: 620;
}
</style>
</head>
<body>
<main class="stage">
  <div class="slide-frame">
    <section class="slide agenda-slide">
      <div class="agenda-title">
        <h1>Agenda</h1>
      </div>
      <div class="path" aria-label="Four part agenda from context to decision">
        <div class="agenda-items">
          <div class="agenda-item"><b>1</b><div><h2>Context shift</h2><p>What changed.</p></div></div>
          <div class="agenda-item current"><b>2</b><div><h2>Evidence</h2><p>What matters.</p></div></div>
          <div class="agenda-item"><b>3</b><div><h2>Tradeoff</h2><p>What we give up.</p></div></div>
          <div class="agenda-item"><b>4</b><div><h2>Decision</h2><p>What we need.</p></div></div>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="../shared.js"></script>
</body>
</html>
