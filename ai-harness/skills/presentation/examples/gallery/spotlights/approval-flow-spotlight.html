<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotlight Slide - Approval Flow</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../shared.css">
<style>
.spotlight-slide {
  grid-template-rows: auto 1fr;
  gap: 34px;
}

.spotlight-head h1 {
  font-size: 52px;
}

.feature-field {
  position: relative;
  display: grid;
  grid-template-columns: 0.88fr 1.12fr;
  gap: 44px;
  align-items: center;
}

.feature-stat {
  display: grid;
  gap: 14px;
}

.feature-stat strong {
  font-size: 136px;
  line-height: 0.86;
}

.feature-stat span {
  max-width: 15ch;
  color: var(--muted);
  font-size: 21px;
  line-height: 1.18;
  font-weight: 760;
}

.approval-path {
  position: relative;
  height: 430px;
}

.approval-path svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.step-label {
  font-size: 22px;
  font-weight: 850;
  fill: var(--ink);
}

.step-sub {
  font-size: 12px;
  font-weight: 850;
  fill: var(--muted);
  text-transform: uppercase;
}
</style>
</head>
<body>
<main class="stage">
  <div class="slide-frame">
    <section class="slide spotlight-slide">
      <header class="spotlight-head slide-title">
        <h1>Approval flow cuts handoffs.</h1>
      </header>
      <div class="feature-field" aria-label="Approval flow feature spotlight">
        <div class="feature-stat">
          <strong>38%</strong>
          <span>faster review cycle</span>
        </div>
        <div class="approval-path">
          <svg viewBox="0 0 650 430" role="img" aria-label="Request, approve, and release path with approval highlighted">
            <defs>
              <marker id="spotlight-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
                <path d="M0,0 L10,5 L0,10 z" fill="#111418"></path>
              </marker>
            </defs>
            <path d="M104 216 C196 96 318 96 406 214 C458 282 516 292 588 246" fill="none" stroke="#d7d2c8" stroke-width="28" stroke-linecap="round"></path>
            <path d="M104 216 C196 96 318 96 406 214 C458 282 516 292 588 246" fill="none" stroke="#111418" stroke-width="5" marker-end="url(#spotlight-arrow)"></path>
            <circle cx="104" cy="216" r="66" fill="#fffdf8" stroke="#111418" stroke-width="3"></circle>
            <circle cx="342" cy="154" r="86" fill="#e9b949" stroke="#111418" stroke-width="3"></circle>
            <circle cx="588" cy="246" r="66" fill="#fffdf8" stroke="#111418" stroke-width="3"></circle>
            <text x="104" y="214" text-anchor="middle" class="step-label">Request</text>
            <text x="104" y="242" text-anchor="middle" class="step-sub">owner set</text>
            <text x="342" y="152" text-anchor="middle" class="step-label">Approve</text>
            <text x="342" y="180" text-anchor="middle" class="step-sub">one click</text>
            <text x="588" y="244" text-anchor="middle" class="step-label">Release</text>
            <text x="588" y="272" text-anchor="middle" class="step-sub">audit trail</text>
          </svg>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="../shared.js"></script>
</body>
</html>
