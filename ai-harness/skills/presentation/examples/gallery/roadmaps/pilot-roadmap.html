<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roadmap Slide - Pilot Plan</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../shared.css">
<style>
.roadmap-slide {
  grid-template-rows: auto 1fr;
  gap: 58px;
}

.roadmap-head {
  display: grid;
  gap: 10px;
  align-items: start;
}

.roadmap-head h1 {
  max-width: 13ch;
  font-size: 70px;
  line-height: 0.98;
  font-weight: 850;
}

.roadmap-head p {
  color: var(--muted);
  font-size: 21px;
  line-height: 1.3;
  font-weight: 620;
}

.timeline {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 22px;
  align-items: stretch;
}

.timeline:before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 190px;
  height: 4px;
  background: var(--ink);
}

.milestone {
  position: relative;
  min-height: 405px;
  display: grid;
  grid-template-rows: 150px auto;
  gap: 42px;
}

.milestone:before {
  content: "";
  position: absolute;
  top: 177px;
  left: 0;
  width: 30px;
  height: 30px;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: var(--bg);
}

.milestone.active:before {
  background: var(--amber);
}

.milestone-label {
  display: grid;
  align-content: end;
  gap: 8px;
}

.milestone-label b {
  color: var(--muted);
  font-size: 13px;
  font-weight: 850;
  text-transform: uppercase;
}

.milestone-label strong {
  font-size: 34px;
  line-height: 1.02;
}

.milestone-detail {
  padding-top: 42px;
  color: var(--muted);
  font-size: 18px;
  line-height: 1.32;
  font-weight: 620;
}

.dependency {
  position: absolute;
  left: 26%;
  right: 26%;
  top: 232px;
  height: 34px;
  border-bottom: 6px solid var(--blue);
}
</style>
</head>
<body>
<main class="stage">
  <div class="slide-frame">
    <section class="slide roadmap-slide content-slide">
      <header class="roadmap-head slide-title">
        <p class="kicker">pilot roadmap</p>
        <h1>Prove support before scaling traffic.</h1>
      </header>
      <div class="timeline" aria-label="Four milestone roadmap with dependency from pilot to expansion">
        <div class="dependency"></div>
        <div class="milestone active"><div class="milestone-label"><b>now</b><strong>Choose cohort</strong></div><p class="milestone-detail">High-signal segment.</p></div>
        <div class="milestone"><div class="milestone-label"><b>week 2</b><strong>Run pilot</strong></div><p class="milestone-detail">Observe failures.</p></div>
        <div class="milestone"><div class="milestone-label"><b>week 5</b><strong>Close gaps</strong></div><p class="milestone-detail">Playbook ready.</p></div>
        <div class="milestone"><div class="milestone-label"><b>week 8</b><strong>Expand</strong></div><p class="milestone-detail">Scale deliberately.</p></div>
      </div>
    </section>
  </div>
</main>
<script src="../shared.js"></script>
</body>
</html>
