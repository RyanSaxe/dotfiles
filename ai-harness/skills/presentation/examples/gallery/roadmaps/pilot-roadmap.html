<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roadmap Slide - Pilot Plan</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../shared.css">
<style>
.roadmap-slide {
  grid-template-rows: auto 1fr;
  gap: 34px;
}

.roadmap-head h1 {
  font-size: 52px;
}

.roadmap {
  position: relative;
  display: grid;
  grid-template-columns: 156px repeat(8, 1fr);
  grid-template-rows: 34px repeat(4, 82px);
  column-gap: 12px;
  row-gap: 18px;
  align-content: center;
}

.roadmap:before {
  content: "";
  position: absolute;
  left: 156px;
  right: 0;
  top: 48px;
  bottom: 0;
  background:
    linear-gradient(90deg, transparent calc(50% - 1px), var(--line) calc(50% - 1px), var(--line) calc(50% + 1px), transparent calc(50% + 1px)) 0 0 / 25% 100%;
  pointer-events: none;
}

.time-label,
.lane-label {
  color: var(--muted);
  font-size: 13px;
  font-weight: 850;
  text-transform: uppercase;
}

.time-label {
  align-self: center;
}

.lane-label {
  align-self: center;
  color: var(--ink);
  font-size: 18px;
  text-transform: none;
}

.work-bar {
  position: relative;
  z-index: 1;
  align-self: center;
  height: 48px;
  border: 2px solid var(--ink);
  border-radius: 24px;
  background: var(--surface);
  padding: 0 22px;
  display: grid;
  align-items: center;
  font-size: 19px;
  font-weight: 820;
}

.work-bar.active {
  background: var(--amber);
}

.work-bar.green {
  background: #d9e5d6;
}

.work-bar.blue {
  background: #d6e4e8;
}

.decision-line {
  position: absolute;
  left: calc(156px + 62.5%);
  right: 0;
  bottom: 18px;
  height: 4px;
  background: var(--ink);
}

.decision-line:before,
.decision-line:after {
  content: "";
  position: absolute;
  top: 50%;
  width: 20px;
  height: 20px;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: var(--amber);
  transform: translateY(-50%);
}

.decision-line:before { left: 0; }
.decision-line:after { right: 0; }

.decision-label {
  position: absolute;
  right: 0;
  bottom: 40px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 850;
  text-transform: uppercase;
}
</style>
</head>
<body>
<main class="stage">
  <div class="slide-frame">
    <section class="slide roadmap-slide content-slide">
      <header class="roadmap-head slide-title">
        <h1>Pilot roadmap shows parallel work.</h1>
      </header>
      <div class="roadmap" aria-label="Pilot roadmap with overlapping workstreams">
        <div></div>
        <div class="time-label" style="grid-column: 2; grid-row: 1;">wk 1</div>
        <div></div>
        <div class="time-label" style="grid-column: 4; grid-row: 1;">wk 3</div>
        <div></div>
        <div class="time-label" style="grid-column: 6; grid-row: 1;">wk 5</div>
        <div></div>
        <div class="time-label" style="grid-column: 8; grid-row: 1;">wk 7</div>
        <div></div>

        <div class="lane-label" style="grid-column: 1; grid-row: 2;">Model readiness</div>
        <div class="work-bar active" style="grid-column: 2 / 5; grid-row: 2;">Eval gate</div>

        <div class="lane-label" style="grid-column: 1; grid-row: 3;">Shadow traffic</div>
        <div class="work-bar blue" style="grid-column: 3 / 7; grid-row: 3;">5% silent run</div>

        <div class="lane-label" style="grid-column: 1; grid-row: 4;">Support path</div>
        <div class="work-bar green" style="grid-column: 4 / 8; grid-row: 4;">Runbook + routing</div>

        <div class="lane-label" style="grid-column: 1; grid-row: 5;">Customer ramp</div>
        <div class="work-bar" style="grid-column: 7 / 10; grid-row: 5;">25% launch</div>

        <div class="decision-line"></div>
        <div class="decision-label">go / hold review</div>
      </div>
    </section>
  </div>
</main>
<script src="../shared.js"></script>
</body>
</html>
