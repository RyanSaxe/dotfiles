<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title Slide - ML System Upgrade</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../shared.css">
<style>
.title-slide {
  grid-template-columns: 0.82fr 1.18fr;
  gap: 62px;
  align-items: center;
}

.title-copy {
  display: grid;
  gap: 24px;
}

.title-copy h1 {
  max-width: 8ch;
  font-size: 104px;
  line-height: 0.94;
  font-weight: 880;
}

.title-copy p {
  max-width: 28ch;
  color: var(--muted);
  font-size: 26px;
  line-height: 1.22;
  font-weight: 620;
}

.ml-visual {
  height: 520px;
  position: relative;
}

.system-sheet {
  position: absolute;
  inset: 18px 8px 22px;
  border: 3px solid var(--ink);
  background: var(--surface);
  box-shadow: 18px 18px 0 var(--surface-2);
  display: grid;
  grid-template-rows: auto 1fr;
}

.sheet-head {
  height: 66px;
  border-bottom: 3px solid var(--ink);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 28px;
}

.sheet-dot {
  width: 14px;
  height: 14px;
  border: 2px solid var(--ink);
  border-radius: 50%;
}

.sheet-body {
  padding: 32px 36px;
  display: grid;
  gap: 26px;
}

.system-lane {
  display: grid;
  grid-template-columns: 132px 1fr;
  gap: 22px;
  align-items: center;
}

.lane-label {
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
}

.lane-track {
  min-height: 78px;
  border: 2px solid var(--ink);
  background: var(--bg);
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 16px;
  align-items: center;
}

.lane-track.two {
  grid-template-columns: 1fr auto 1fr auto 1fr;
}

.system-card {
  min-height: 48px;
  background: var(--surface);
  border: 2px solid var(--ink);
  display: grid;
  place-items: center;
  text-align: center;
  font-size: 18px;
  font-weight: 850;
}

.system-card.accent {
  background: var(--amber);
}

.system-arrow {
  font-size: 28px;
  font-weight: 900;
}

.checklist {
  border: 2px solid var(--ink);
  background: #d9e5d6;
  padding: 18px 20px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.check-item {
  display: grid;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 850;
  text-transform: uppercase;
}

.check-item strong {
  color: var(--ink);
  font-size: 23px;
  line-height: 1;
  text-transform: none;
}
</style>
</head>
<body>
<main class="stage">
  <div class="slide-frame">
    <section class="slide title-slide">
      <div class="title-copy">
        <h1>ML System Upgrade</h1>
        <p>Move the model behind a measurable release gate.</p>
      </div>
      <div class="ml-visual" aria-label="ML system upgrade flow">
        <div class="system-sheet">
          <div class="sheet-head"><div class="sheet-dot"></div><div class="sheet-dot"></div><div class="sheet-dot"></div></div>
          <div class="sheet-body">
            <div class="system-lane">
              <div class="lane-label">Training</div>
              <div class="lane-track">
                <div class="system-card">Feature store</div>
                <div class="system-arrow">&rarr;</div>
                <div class="system-card">Model v2</div>
              </div>
            </div>
            <div class="system-lane">
              <div class="lane-label">Validation</div>
              <div class="lane-track two">
                <div class="system-card">Offline eval</div>
                <div class="system-arrow">&rarr;</div>
                <div class="system-card accent">Release gate</div>
                <div class="system-arrow">&rarr;</div>
                <div class="system-card">Shadow run</div>
              </div>
            </div>
            <div class="system-lane">
              <div class="lane-label">Serving</div>
              <div class="lane-track">
                <div class="system-card">5% canary</div>
                <div class="system-arrow">&rarr;</div>
                <div class="system-card">Full traffic</div>
              </div>
            </div>
            <div class="checklist">
              <div class="check-item"><strong>+3.2%</strong> lift</div>
              <div class="check-item"><strong>42ms</strong> p95</div>
              <div class="check-item"><strong>0</strong> blocker checks</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="../shared.js"></script>
</body>
</html>
