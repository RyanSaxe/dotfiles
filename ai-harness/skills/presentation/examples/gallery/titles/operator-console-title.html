<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title Slide - Operator Console</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../shared.css">
<style>
.title-slide {
  grid-template-columns: 0.9fr 1.1fr;
  gap: 66px;
  align-items: center;
}

.title-copy {
  display: grid;
  gap: 22px;
}

.title-copy h1 {
  max-width: 9ch;
  font-size: 94px;
  line-height: 0.96;
  font-weight: 850;
}

.title-copy p {
  max-width: 31ch;
  color: var(--muted);
  font-size: 25px;
  line-height: 1.24;
  font-weight: 620;
}

.console-visual {
  height: 470px;
  border: 2px solid var(--ink);
  background: var(--surface);
  display: grid;
  grid-template-columns: 220px 1fr;
  position: relative;
}

.console-nav {
  border-right: 2px solid var(--ink);
  padding: 26px;
  display: grid;
  align-content: start;
  gap: 14px;
}

.nav-line {
  height: 14px;
  background: var(--surface-2);
}

.nav-line.active {
  background: var(--amber);
}

.console-main {
  padding: 30px;
  display: grid;
  grid-template-rows: 60px 1fr 92px;
  gap: 24px;
}

.console-top {
  display: grid;
  grid-template-columns: 1fr 160px;
  gap: 18px;
}

.console-block {
  border: 1px solid var(--line);
  background: var(--bg);
}

.incident-path {
  position: absolute;
  left: 310px;
  top: 214px;
  width: 392px;
  height: 132px;
  border-left: 8px solid var(--red);
  border-bottom: 8px solid var(--red);
}

.incident-dot {
  position: absolute;
  right: 96px;
  top: 170px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 0 12px rgba(215, 95, 70, 0.16);
}
</style>
</head>
<body>
<main class="stage">
  <div class="slide-frame">
    <section class="slide title-slide">
      <div class="title-copy">
        <p class="kicker">product review</p>
        <h1>Operator Console Redesign.</h1>
        <p>Make incidents visible before operators have to hunt.</p>
      </div>
      <div class="console-visual" aria-label="Simplified operator console with highlighted incident path">
        <div class="console-nav">
          <div class="nav-line active"></div>
          <div class="nav-line"></div>
          <div class="nav-line"></div>
          <div class="nav-line"></div>
        </div>
        <div class="console-main">
          <div class="console-top"><div class="console-block"></div><div class="console-block"></div></div>
          <div class="console-block"></div>
          <div class="console-block"></div>
        </div>
        <div class="incident-path"></div>
        <div class="incident-dot"></div>
      </div>
    </section>
  </div>
</main>
<script src="../shared.js"></script>
</body>
</html>
