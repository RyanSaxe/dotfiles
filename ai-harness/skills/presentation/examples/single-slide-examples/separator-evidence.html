<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Separator Slide - Evidence</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="shared.css">
<style>
.separator-slide {
  align-content: center;
  gap: 38px;
}

.separator-grid {
  display: grid;
  grid-template-columns: 0.92fr 1.08fr;
  gap: 72px;
  align-items: center;
}

.section-number {
  color: var(--muted);
  font-size: 18px;
  font-weight: 850;
}

.separator-copy {
  display: grid;
  gap: 24px;
}

.separator-copy h1 {
  max-width: 7ch;
  font-size: 116px;
  line-height: 0.92;
  font-weight: 880;
}

.separator-copy p {
  max-width: 34ch;
  color: var(--muted);
  font-size: 25px;
  line-height: 1.24;
  font-weight: 620;
}

.evidence-meter {
  height: 380px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  align-items: end;
  border-bottom: 3px solid var(--ink);
  padding: 0 20px;
}

.meter {
  display: grid;
  align-content: end;
  gap: 12px;
}

.bar {
  border: 2px solid var(--ink);
  background: var(--surface);
}

.bar.one { height: 118px; }
.bar.two {
  height: 252px;
  background: var(--amber);
}
.bar.three { height: 178px; }

.meter span {
  color: var(--muted);
  font-size: 14px;
  font-weight: 800;
  text-transform: uppercase;
}
</style>
</head>
<body>
<main class="stage">
  <div class="slide-frame">
    <section class="slide separator-slide">
      <div class="separator-grid">
        <div class="separator-copy">
          <span class="section-number">02</span>
          <h1>Evidence</h1>
          <p>From opinion to signal.</p>
          <div class="accent-line"></div>
        </div>
        <div class="evidence-meter" aria-label="Three evidence bars with the middle signal highlighted">
          <div class="meter"><div class="bar one"></div><span>survey</span></div>
          <div class="meter"><div class="bar two"></div><span>usage</span></div>
          <div class="meter"><div class="bar three"></div><span>support</span></div>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="shared.js"></script>
</body>
</html>
