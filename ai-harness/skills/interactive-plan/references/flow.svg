<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -55 1040 535" role="img" aria-labelledby="flowTitle flowDesc"><title id="flowTitle">Interactive planning with a shared review loop</title><desc id="flowDesc">Explicitly invoke the skill and clarify in conversation. Explore proposals, then review the composed plan. Final review can reopen focused exploration before returning to a complete revised plan. Both browser phases use inspect and comment, submit, agent acknowledgement, and revision, with clarification when needed. Accept the exact final plan revision for handoff, choosing to save it or explicitly start implementation.</desc><rect y="-55" width="1040" height="535" fill="var(--bg,#ffffff)"/><defs><marker id="flowArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="var(--muted,#666)"/></marker></defs><style>.flow-box{fill:var(--panel,#fff);stroke:var(--line,#ccc);stroke-width:1.5}.flow-label{fill:var(--ink,#242424);font:600 16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;text-anchor:middle}.flow-sub{fill:var(--muted,#616161);font:13px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;text-anchor:middle}.flow-line{fill:none;stroke:var(--muted,#666);stroke-width:1.5;marker-end:url(#flowArrow)}.flow-link{fill:none;stroke:var(--blue,#005fb8);stroke-width:1.5;stroke-dasharray:5 5}</style>
<path class="flow-line" d="M653 15 V-10 H385 V7" stroke-dasharray="5 5"/><text class="flow-sub" x="520" y="-27">Reopen a choice when needed</text>
<rect class="flow-box" x="10" y="15" width="215" height="95" rx="5"/><text class="flow-label" x="117" y="43">Clarify the idea</text><text class="flow-sub" x="117" y="67">Explicit skill invocation</text><text class="flow-sub" x="117" y="87">Agent conversation</text>
<rect class="flow-box" x="278" y="15" width="215" height="95" rx="5" style="stroke:var(--blue,#005fb8)"/><text class="flow-label" x="385" y="48">Explore proposals</text><text class="flow-sub" x="385" y="76">Compare concrete options</text>
<rect class="flow-box" x="546" y="15" width="215" height="95" rx="5" style="stroke:var(--blue,#005fb8)"/><text class="flow-label" x="653" y="48">Review the final plan</text><text class="flow-sub" x="653" y="76">Inspect the composed steps</text>
<rect class="flow-box" x="814" y="15" width="215" height="95" rx="5"/><text class="flow-label" x="921" y="43">Accept the plan</text><text class="flow-sub" x="921" y="67">Save for later</text><text class="flow-sub" x="921" y="87">or start implementation</text>
<path class="flow-line" d="M225 62 H270"/><path class="flow-line" d="M493 62 H538"/><path class="flow-line" d="M761 62 H806"/>
<path class="flow-link" d="M385 110 V155 H465 V185 M653 110 V155 H575 V185"/>
<rect x="10" y="185" width="1019" height="275" rx="6" fill="var(--bg,#f8f8f8)" stroke="var(--line,#ccc)"/>
<text class="flow-label" x="520" y="218">The same browser review loop</text>
<rect class="flow-box" x="40" y="250" width="190" height="65" rx="4"/><text class="flow-label" x="135" y="289">Inspect &amp; comment</text>
<rect class="flow-box" x="290" y="250" width="190" height="65" rx="4"/><text class="flow-label" x="385" y="277">Submit feedback</text><text class="flow-sub" x="385" y="299">Save an explicit round</text>
<rect class="flow-box" x="540" y="250" width="190" height="65" rx="4"/><text class="flow-label" x="635" y="277">Agent reads</text><text class="flow-sub" x="635" y="299">Acknowledge receipt</text>
<rect class="flow-box" x="790" y="250" width="209" height="65" rx="4"/><text class="flow-label" x="894" y="277">Revise &amp; publish</text><text class="flow-sub" x="894" y="299">Offer the next revision</text>
<path class="flow-line" d="M230 282 H282"/><path class="flow-line" d="M480 282 H532"/><path class="flow-line" d="M730 282 H782"/>
<path class="flow-line" d="M895 315 V428 H135 V323"/>
<rect class="flow-box" x="540" y="353" width="190" height="46" rx="4"/><text class="flow-sub" x="635" y="381">Clarifying questions</text>
<path class="flow-line" d="M605 315 V345" stroke-dasharray="4 5"/><path class="flow-line" d="M665 353 V323" stroke-dasharray="4 5"/>
<text class="flow-sub" x="305" y="419">Continue until aligned</text></svg>
