<div class="scope-list" data-multiselect="SCOPE_ID" data-label="Scope label">
  <p class="scope-count"><b>0 of N</b> included</p>
  <label class="scope-row">
    <span>
      <strong>Scope item <span class="tag">Recommended</span></strong>
      <span class="scope-description"
        >What including this item adds to the work.</span
      >
    </span>
    <input
      type="checkbox"
      class="scope-check"
      data-value="ITEM_ID"
      data-label="Scope item"
    />
  </label>
  <!-- Repeat the row for each independent scope item. No row ships checked. -->
</div>
