<div class="scope-list">
  <section
    class="scope-row"
    data-choice="SCOPE_ID"
    data-label="Scope item label"
  >
    <div>
      <h3>Scope item</h3>
      <p>What including this item adds to the work.</p>
    </div>
    <div class="scope-actions">
      <label><input type="checkbox" class="scope-check" /> Include</label>
      <button hidden data-value="Include">Include</button>
      <button hidden data-value="Defer">Defer</button>
    </div>
  </section>
  <!-- Repeat the row for each independent scope item. -->
</div>
