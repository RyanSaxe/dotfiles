<section
  class="drawing-question"
  data-drawing-question="QUESTION_ID"
  data-label="Short label for the drawing"
  data-kind="drawing question"
>
  <span class="tag">Drawing question</span>
  <h3>What should the reviewer draw?</h3>
  <p>Why the drawing will help the agent decide.</p>
  <img class="drawing-preview" alt="Saved drawing" hidden />
  <button class="btn primary" type="button" data-draw>Draw answer</button>
  <p class="renderer-error" data-drawing-error role="status" hidden></p>
</section>
