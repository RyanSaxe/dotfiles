<section class="decision" data-choice="DECISION_ID" data-label="Decision label">
  <h3>The question the user answers</h3>
  <button
    class="decision-option"
    type="button"
    data-value="OPTION_A"
    data-label="Option A"
  >
    <b>Option A <span class="tag">Recommended</span></b>
    <p>One line of consequence, and the reason it is recommended.</p>
  </button>
  <button
    class="decision-option"
    type="button"
    data-value="OPTION_B"
    data-label="Option B"
  >
    <b>Option B</b>
    <p>One line of consequence.</p>
  </button>
  <!-- Repeat the option button. Keep decision and option IDs stable. -->
</section>
