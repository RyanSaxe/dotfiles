<div class="behavior-cases" data-kind="set of cases">
  <div class="behavior-head" aria-hidden="true">
    <span>When</span><span>Proposed behavior</span><span></span>
  </div>
  <section class="behavior-case" id="CASE_ID">
    <h3><span class="micro">When</span>Situation</h3>
    <div>
      <span class="micro">Then</span>Expected outcome and any detail needed to
      judge it.
    </div>
    <button class="btn" data-comment="CASE_ID: Situation">Revise</button>
  </section>
  <!-- Repeat the section for each behavior that needs agreement. -->
</div>
