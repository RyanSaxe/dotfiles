name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Web: the oxfmt and oxlint hooks run from node_modules.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      # Rust: clippy and rustfmt run from the toolchain.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Go: install golangci-lint only so prek runs both fmt and run.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6
          install-only: true

      # Lua: install pinned stylua, emmylua_check and luacheck for prek.
      - uses: taiki-e/install-action@v2
        with:
          tool: stylua@2.1.0
      - name: Install emmylua_check and luacheck
        run: |
          version=0.14.0
          url="https://github.com/EmmyLuaLs/emmylua-analyzer-rust/releases/download/${version}/emmylua_check-linux-x64.tar.gz"
          curl -fsSL "$url" | tar -xz -C /usr/local/bin
          sudo apt-get update && sudo apt-get install -y lua-check

      # Shell: install pinned shfmt plus shellcheck and zsh for prek.
      - uses: taiki-e/install-action@v2
        with:
          tool: shfmt@3.14.1
      - name: Install shellcheck and zsh
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh

      # Nix: install Nix and put nixfmt, deadnix and statix on PATH for prek.
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Install Nix lint tools
        run: |
          tools=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#nixfmt nixpkgs#deadnix nixpkgs#statix | sed 's|$|/bin|' | paste -sd: -)
          echo "$tools" | tr ':' '\n' >> "$GITHUB_PATH"

      - run: uvx prek@0.5.11 run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Python
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv run --locked pytest

      # Web
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

      # Rust: add `cargo machete` or `cargo deny check` here for shipped crates.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

      # Go
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

      # Lua: run busted or `nvim --clean --headless` tests here when present.
