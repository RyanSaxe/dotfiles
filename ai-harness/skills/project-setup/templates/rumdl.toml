[global]
# Formatting fixes only layout: wrapping, indents, blank lines, spacing,
# tables and markers. Other fixes would change what a file says, such as a
# heading's level or a code block's language, so the lint only reports them.
fixable = [
  "MD004", "MD005", "MD007", "MD009", "MD010", "MD012", "MD013", "MD019",
  "MD020", "MD021", "MD022", "MD023", "MD027", "MD030", "MD031", "MD032",
  "MD035", "MD047", "MD048", "MD049", "MD050", "MD055", "MD058", "MD060",
  "MD064", "MD065", "MD071", "MD076", "MD077", "MD085",
]

[MD013]
line-length = 80
reflow = true
# Rewrap every paragraph. The default mode only breaks lines that are too
# long, so a shortened line never closes up.
reflow-mode = "normalize"
# A command or a line of code can't wrap.
code-blocks = false

# The README shows each diagram in a light and a dark version through
# <picture>.
[MD033]
allowed-elements = ["picture", "source", "img"]
