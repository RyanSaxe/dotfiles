        changes when the dashboard rewrites the cache.

        Move the parse into module scope (or a memoized helper) so it
        runs once per Neovim session unless explicitly invalidated.
      status: open

    - id: rev-008
      file: zsh/aliases.zsh
      line: 33
      severity: low
      category: correctness
      body: |
        `env -u TMUX claude` strips only `TMUX` — but `TMUX_PANE` and
        `TMUX_TMPDIR` are still set in the environment. If Claude Code
        (or any subprocess it spawns) checks for a tmux session via the
        broader heuristic of "any TMUX*-prefixed var," the workaround is
        incomplete.

        Verify the upstream check is `process.env.TMUX` only; if so, this
        is fine and the comment should drop. If it also checks the prefix
        family, also unset `TMUX_PANE` and `TMUX_TMPDIR`.
      status: open

    - id: rev-009
      file: zsh/aliases.zsh
      line: 50
      severity: high
      category: arch
      body: |
        `alias pptx='uvx --refresh --from ~/work/Reusable/ppt-generator ppt'`
        hardcodes a host-specific path (`~/work/Reusable/...`) into a file
        that's symlinked across every machine running these dotfiles. On
        any host without that directory, sourcing this file emits no error
        (alias creation doesn't validate the target), but `pptx` will fail
        at use-time with a confusing message.

        Move host-specific aliases into a sourced-but-gitignored file
        (e.g., `~/.zsh/local-aliases.zsh`) and have `aliases.zsh` source
        it conditionally. The dotfiles repo's `# special local tools`
        comment on line 48 already signals the author knew this wasn't
        quite right.
      status: open
