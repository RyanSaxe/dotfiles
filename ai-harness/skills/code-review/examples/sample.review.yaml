      status: open
      feedback: |
        Low priority — on macOS/Linux the `comm` field from `ps` is
        argv[0]'s basename, which is always lowercase for these binaries
        in practice. Downgrade to `info` or drop the comment on next
        iteration.

    - id: rev-004
      file: tmux/tmux.conf
      start_line: 12
      line: 19
      severity: high
      category: correctness
      body: |
        Three globally-set environment variables in a row (`COLORTERM`,
        `FORCE_COLOR`, `LC_TERMINAL`) leak into *every* process started
        inside this tmux session — not just Claude Code or chalk.
        `FORCE_COLOR=3` in particular is read by Python's `rich`, `pip`,
        `npm`, and many other CLIs; forcing truecolor where the consuming
        terminal genuinely doesn't support it produces escape-sequence
        garbage.

        The `LC_TERMINAL=ghostty` lie (line 19) is the riskiest — any tool
        that gates behavior on terminal identity (e.g., image protocols,
        sixel, kitty graphics) will activate features the actual terminal
        can't render.

        Scope these to the specific commands that need them — wrap
        claude/codex/etc. invocations with `env COLORTERM=truecolor …`
        rather than setting globally.
      status: open

    - id: rev-005
      file: tmux/tmux.conf
      line: 21
      severity: low
      category: correctness
      body: |
        `set -g escape-time 0` is a footgun on slow networks (mosh, ssh) —
        terminals interpret a real Escape press as the start of a CSI
        sequence, and zero delay can turn a deliberate Esc into an aborted
        partial sequence. The conventional safe value is 10–50ms.
      status: open

