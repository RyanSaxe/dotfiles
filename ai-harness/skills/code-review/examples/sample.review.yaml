    - id: rev-001
      file: ai-harness/scripts/attention-daemon.sh
      start_line: 18
      line: 28
      severity: high
      category: correctness
      body: |
        TOCTOU race on lock recovery. If `mkdir "$lock_dir"` (line 18) fails,
        the recovery branch reads `pid_file` (line 19) — but a peer daemon
        that just won the initial mkdir may not have written its PID yet
        (the write happens at line 30, *after* this whole `if` block). In
        that window we fall through to `rm -rf "$lock_dir"` on line 26,
        clobber a healthy lock, and both daemons proceed.

        Symptom: duplicate notifications when daemons race on startup. Fix
        is design-level — either make PID write atomic with acquisition
        (`mkdir lock_dir/pid-$$`), or sleep-and-retry on contention instead
        of rm-and-retake.
      status: open

    - id: rev-002
      file: ai-harness/claude/hooks/send-notification.sh
      line: 5
      severity: medium
      category: arch
      body: |
        `$script_dir/../..` hardcodes the hook's depth relative to
        `ai-harness/`. If the hook ever moves (e.g., into a deeper
        `claude/hooks/notifications/` subdir, or gets symlinked from
        elsewhere), this silently resolves to the wrong directory and
        `exec bash` runs whatever happens to be at that path — or fails
        with a confusing "no such file."

        Anchor on a stable marker (the `scripts/` sibling) so the hook
        keeps working under reorganization.
      suggestion: |
        harness_root="$script_dir"
        while [[ "$harness_root" != "/" && ! -d "$harness_root/scripts" ]]; do
          harness_root="$(dirname "$harness_root")"
        done
        harness_notify="$harness_root/scripts/notify.sh"
      status: open

    - id: rev-003
