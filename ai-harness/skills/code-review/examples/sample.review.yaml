      severity: medium
      category: perf
      body: |
        Pokemon-color cache is read and parsed on every call to
        `on_highlights`, which fires on every colorscheme reload
        (`:colorscheme`, `:hi clear`, theme toggles, even some plugin
        reloads). The file IO + line-by-line regex match isn't expensive
