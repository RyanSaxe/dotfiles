      line: 12
      severity: low
      category: style
      body: |
        The agent-name match mixes a case-sensitive `comm == "claude"` check
        against unmodified `$1` with a case-insensitive regex on
        `tolower($0)`. The two paths can disagree on a binary named `Claude`
        (exact-case `comm` fails, regex catches it on the next iteration).
        Either lowercase `comm` once at the top of the awk block, or drop
