approval_policy = "on-request"
approvals_reviewer = "auto_review"
model = "gpt-5.6-luna"
service_tier = "default"

[features]
fast_mode = false

[tui]
theme = "dotfiles"
status_line = [
  "project-name",
  "git-branch",
  "model-with-reasoning",
  "context-remaining",
  "used-tokens",
  "five-hour-limit",
  "weekly-limit",
  "task-progress",
]
status_line_use_colors = true
