# Global workmux configuration. Per-repo .workmux.yaml files override this
# only where a project needs different hooks, files, or an agent.

agent: codex

# Workmux invokes the binary directly, so make the global Codex defaults
# explicit instead of relying on the interactive zsh wrapper.
agents:
  codex:
    type: codex
    command: codex
    args:
      - --profile
      - dotfiles
      - --model
      - gpt-5.6-luna
      - --config
      - 'model_reasoning_effort="xhigh"'
      - --config
      - 'approvals_reviewer="auto_review"'
      - --ask-for-approval
      - on-request

# Named pane layouts, selected with `workmux add -l <name>`.
#
# `review` is the human review surface the rail's Reviews dashboard opens: one
# pane, an editor, no agent. It exists as a layout rather than a flag because
# the global `agent: codex` would otherwise start a reviewer nobody asked for
# every time a pull request is opened to be read.
layouts:
  review:
    panes:
      - command: nvim
        name: review
        focus: true

# Reproduce the main worktree's ignored, untracked files in every new
# worktree. If the project uses BYOR, register and refresh the new checkout
# after its .byor directory has been copied. A project post_create list must
# include "<global>" to retain these hooks.
post_create:
  - workmux-copy-ignored
  - "if [ -d .byor ]; then byor sync; fi"

# All worktrees under one root, out of the project directories.
worktree_dir: ~/worktrees/{project}

# tmux window formats belong to tmux.conf (the pill design): workmux only
# sets @workmux_status per window, and the pills render it themselves.
status_format: false

# Status glyphs, colored through the theme's tmux variables so they follow
# light/dark. Status semantics never take mascot colors: working=mauve
# (operational), waiting=peach (act now), done=green (glance).
status_icons:
  working: "#[fg=#{@status_working}]●#[fg=default]"
  waiting: "#[fg=#{@status_waiting}]●#[fg=default]"
  done: "#[fg=#{@status_done}]✓#[fg=default]"
nerdfont: true
