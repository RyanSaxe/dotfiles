# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking
#
# NOTES: below has links to docs that govern things I ran into:
#
# 1. you must set your monitor arrangement to have corner gaps: https://nikitabobko.github.io/AeroSpace/guide#proper-monitor-arrangement
# 2. 

# Config version for compatibility and deprecations
# Fallback value (if you omit the key): config-version = 1
config-version = 2

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 100

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Notify sketchybar when workspace changes (for workspace indicator updates)
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
]

# Only keep *your* workspaces alive
persistent-workspaces = [
  "message",   # mail/messages (merged email+chat) - key V
  "browser",   # key B
  "code",      # key N
  "meeting",   # Teams meetings/calls - key M
  "monitor-1",
  "monitor-2",
  "monitor-3",
]


# ----------------------------
# STARTUP: open apps
# ----------------------------
# We:
# - open apps (windows will be routed by on-window-detected rules below)

# TODO: consider making this more involved and moving it to a startup script
after-startup-command = [
  'exec-and-forget borders',
  'exec-and-forget sketchybar',
  # Ghostty CODE window
  'exec-and-forget /usr/bin/open -n -a "Ghostty" --args --title="WT:code"',
  # Ghostty NOTES window
  'exec-and-forget /usr/bin/open -n -a "Ghostty" --args --title="WT:notes"',
  # Wait for first Teams window, then move it to message (left monitor)
  'exec-and-forget /usr/bin/open -a "Microsoft Teams"',

  '''exec-and-forget /bin/sh -lc '
    for i in $(seq 1 80); do
      id=$(
        aerospace list-windows --all \
          | grep -E "Microsoft Teams" \
          | sed -E "s/^ *([0-9]+).*/\\1/" \
          | head -n 1
      )
      if [ -n "$id" ]; then
        aerospace move-node-to-workspace --window-id "$id" --focus-follows-window message
        exit 0
      fi
      sleep 0.1
    done
  ' ''',
  # wait for NOTES window, then move it to meeting (right monitor)
  '''exec-and-forget /bin/sh -lc '
    for i in $(seq 1 80); do
      id=$(
        aerospace list-windows --all \
          | grep -E "Ghostty | WT:notes" \
          | sed -E "s/^ *([0-9]+).*/\\1/" \
          | head -n 1
      )
      if [ -n "$id" ]; then
        aerospace move-node-to-workspace --window-id "$id" --focus-follows-window meeting
        exit 0
      fi
      sleep 0.1
    done
  ' ''',

  'exec-and-forget /usr/bin/open -a "Microsoft Outlook"',
]

# ----------------------------
# WORKSPACES -> MONITORS
# ----------------------------
# Monitor patterns:
# 1 = left-to-right sequence number (1-based)
# 'main' = whatever macOS marks as main display
[workspace-to-monitor-force-assignment]
message = 1      # mail/messages (left monitor, key V)
browser = "main" # center monitor, key B
code = "main"    # center monitor, key N
meeting = 3      # Teams meetings (right monitor, key M)


# ----------------------------
# WINDOW ROUTING (APP -> WORKSPACE)
# ----------------------------

# Outlook -> message 
[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = [
  'move-node-to-workspace --focus-follows-window message',
  'layout v_tiles',
]

# Teams: everything else (meetings/calls/etc) -> meeting (vertical tiles)
[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = [
  'move-node-to-workspace --focus-follows-window meeting',
  'layout v_tiles',
]

# Teams: chat windows
[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
if.window-title-regex-substring = '^Chat \\|'
run = [
  'move-node-to-workspace --focus-follows-window message',
  'layout v_tiles',
]
# Teams: calendar windows
[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
if.window-title-regex-substring = '^Calendar \\|'
run = [
  'move-node-to-workspace --focus-follows-window message',
  'layout v_tiles',
]

# Chrome -> browser (horizontal)
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = [
  'move-node-to-workspace --focus-follows-window browser',
  'layout h_tiles',
]

# Ghostty code window -> code (horizontal)
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace --focus-follows-window code', 'layout h_tiles']

# Floating windows for system apps
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

# -----------------------------------------------------------------------------
# Gaps Configuration
# -----------------------------------------------------------------------------
# Defines spacing around and between windows.
[gaps]
# Space between adjacent tiled windows.
# NOTE: I like the look best with this set to 10, but my company has control over 
#       my machine's wallpaper and so spaces between windows can be distracting.
inner.horizontal = 1
inner.vertical = 1

# Space between the outermost windows and the screen edges.
# Ensure these are numbers (Integers), not strings (no quotes needed).
outer.left = 1
outer.bottom = 1
outer.top = 36
outer.right = 1
# ----------------------------
# KEYBINDINGS (NO ALT; COMMAND-BASED)
# ----------------------------
[key-mapping]
preset = 'qwerty'

[mode.main.binding]

# each monitor has an accordion workspace to send things to
# for example, I like to read docs and chatgpt on my left monitor where I can easily cycle through them
alt-cmd-1 = 'workspace monitor-1'
alt-cmd-2 = 'workspace monitor-2'
alt-cmd-3 = 'workspace monitor-3'
alt-cmd-shift-1 = [
  'move-node-to-workspace monitor-1',
  'workspace monitor-1',
  'move-workspace-to-monitor 1',
  'layout v_accordion',
]

# Move to center monitor in a temp workspace
alt-cmd-shift-2 = [
  'move-node-to-workspace monitor-2',
  'workspace monitor-2',
  'move-workspace-to-monitor 2',
  'layout h_accordion',
]

# Move to right most monitor in a temp workspace
alt-cmd-shift-3 = [
  'move-node-to-workspace monitor-3',
  'workspace monitor-3',
  'move-workspace-to-monitor 3',
  'layout v_accordion',
]

# Focus (cmd+ctrl+h/j/k/l)
cmd-alt-h = 'focus left --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
cmd-alt-j = 'focus down --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
cmd-alt-k = 'focus up --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
cmd-alt-l = 'focus right --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'

# Move windows (cmd+ctrl+shift+h/j/k/l)
cmd-alt-shift-h = 'move left'
cmd-alt-shift-j = 'move down'
cmd-alt-shift-k = 'move up'
cmd-alt-shift-l = 'move right'

# Toggle orientation
cmd-alt-slash = 'layout horizontal vertical'

# Workspace switching (cmd+alt + bottom row keys, left-to-right matches monitors)
cmd-alt-v = 'workspace message' # left monitor - mail/messages
cmd-alt-b = 'workspace browser' # center monitor
cmd-alt-n = 'workspace code'    # center monitor
cmd-alt-m = 'workspace meeting' # right monitor - Teams meetings

# Send focused window to workspace (cmd+alt+shift + letter)
cmd-alt-shift-v = [
  'move-node-to-workspace message',
  'workspace message',
  'layout v_tiles',
]
cmd-alt-shift-b = [
  'move-node-to-workspace browser',
  'workspace browser',
  'layout h_tiles',
]
cmd-alt-shift-n = [
  'move-node-to-workspace code',
  'workspace code',
  'layout h_tiles',
]
cmd-alt-shift-m = [
  'move-node-to-workspace meeting',
  'workspace meeting',
  'layout v_tiles',
]

# Focus monitor 

# Back and forth
cmd-alt-tab = 'workspace-back-and-forth'
cmd-alt-shift-r = 'reload-config'
cmd-alt-f = 'fullscreen'

# modes
cmd-alt-shift-semicolon = 'mode service'
cmd-alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']                # reset layout
f = ['layout floating tiling', 'mode main']                # toggle floating/tiling
backspace = ['close-all-windows-but-current', 'mode main']
cmd-alt-h = ['join-with left', 'mode main']
cmd-alt-j = ['join-with down', 'mode main']
cmd-alt-k = ['join-with up', 'mode main']
cmd-alt-l = ['join-with right', 'mode main']
