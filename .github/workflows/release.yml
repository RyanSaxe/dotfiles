name: release

# develop -> main merges cut a release automatically. The semver bump is
# derived from conventional commit prefixes since the last tag,
# case-insensitively: feat -> minor, breaking (type!: or a BREAKING
# CHANGE: footer) -> major, anything else -> patch. Tags must be plain
# vMAJOR.MINOR.PATCH; a prerelease or otherwise malformed last tag fails
# the run instead of doing arithmetic on it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two rapid merges would compute the same next version and the loser's
# commits would sit unreleased until the next push. Serialized, a queued
# run checks out after the winner's tag exists and stacks on top of it.
# (An intermediate queued run may be superseded by a newer one; the newer
# run releases its commits too.)
concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute the next version
        id: version
        run: |
          last="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -z "$last" ]; then
            echo "next=v1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! echo "$last" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::last tag '$last' is not vMAJOR.MINOR.PATCH; fix the tag before releasing"
            exit 1
          fi
          if [ -z "$(git log --format=%s "$last..HEAD")" ]; then
            echo "next=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bump=patch
          git log --format=%s "$last..HEAD" | grep -qiE '^feat(\(.*\))?:' && bump=minor
          # The footer needs its colon: a body line merely quoting the
          # words "BREAKING CHANGE" must not force a major.
          if git log --format=%s "$last..HEAD" | grep -qiE '^[a-z]+(\(.*\))?!:' ||
            git log --format=%b "$last..HEAD" | grep -qE '^BREAKING[- ]CHANGE:'; then
            bump=major
          fi
          v="${last#v}"
          major="${v%%.*}"
          rest="${v#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          case "$bump" in
            major) major=$((major + 1)) minor=0 patch=0 ;;
            minor) minor=$((minor + 1)) patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "next=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Create the release
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.next }}" \
            --target "$GITHUB_SHA" --generate-notes
