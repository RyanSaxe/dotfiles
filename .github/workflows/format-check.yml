name: Format Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install stylua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

      - name: Install shfmt
        run: |
          # Get latest shfmt release URL via GitHub API
          SHFMT_URL=$(curl -fsSL https://api.github.com/repos/mvdan/sh/releases/latest | grep -o 'https://[^"]*shfmt_v[^"]*_linux_amd64' | head -1)
          curl -fsSL "$SHFMT_URL" -o shfmt
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/

      - name: Install prettier and markdownlint
        run: npm install -g prettier markdownlint-cli

      - name: Check Shell formatting (shfmt)
        run: |
          echo "Checking shell files..."
          # Find all .sh files and check formatting
          # Using same options as conform.nvim and pre-commit hook
          find . -name "*.sh" -type f | while read -r file; do
            if ! shfmt -i 2 -ci -bn -sr -d "$file" > /dev/null 2>&1; then
              echo "::error file=$file::Shell file is not formatted correctly"
              shfmt -i 2 -ci -bn -sr -d "$file" || true
              exit 1
            fi
          done
          echo "All shell files are formatted correctly"

      - name: Check JSON formatting (prettier)
        run: |
          echo "Checking JSON files..."
          find . -name "*.json" -type f ! -path "./node_modules/*" | while read -r file; do
            if ! prettier --check "$file" > /dev/null 2>&1; then
              echo "::error file=$file::JSON file is not formatted correctly"
              exit 1
            fi
          done
          echo "All JSON files are formatted correctly"

      - name: Check Markdown formatting (markdownlint)
        run: |
          echo "Checking Markdown files..."
          # Use the dotfiles markdownlint config
          markdownlint --config nvim/.markdownlint.yaml "**/*.md" || {
            echo "::error::Markdown files have linting issues. Run 'markdownlint --fix' locally."
            exit 1
          }
          echo "All Markdown files pass linting"

      - name: Check Python formatting (ruff format)
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

      - name: Check Python linting (ruff check)
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"
