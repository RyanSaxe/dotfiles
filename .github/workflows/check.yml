name: check

on:
  push:
    branches: [v2]
  pull_request:

# Neither job has an age key, so neither decrypts a secret. A build only
# checks that secrets/secrets.yaml has each key a config names.
jobs:
  mac:
    # Apple Silicon, like the Mac configs it builds.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: astral-sh/setup-uv@v5

      - name: prek
        # The query check needs Neovim's plugins and parsers, which only a
        # computer that runs Neovim has.
        env:
          SKIP: nvim-queries
        run: |
          tools=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#stylua nixpkgs#shfmt nixpkgs#go | sed 's|$|/bin|' | paste -sd: -)
          PATH="$tools:$PATH" uvx prek run --all-files --show-diff-on-failure

      - name: Build this Mac's configs
        run: |
          nix build --no-link --print-build-logs \
            .#darwinConfigurations.mac.system \
            '.#homeConfigurations."ryansaxe@mac".activationPackage'

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build the Linux home config
        run: |
          nix build --no-link --print-build-logs \
            '.#homeConfigurations."ryansaxe@linux".activationPackage'
