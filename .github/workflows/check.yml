name: check

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # zsh runs the workmux hook checks; ripgrep is what the vault
      # contract check shells out to, and pytest (vault) exercises it.
      - name: Install zsh and ripgrep
        run: |
          sudo apt-get update -q
          sudo apt-get install -y zsh ripgrep
          zsh --version

      - name: Install StyLua
        run: |
          npm install --global --prefix "$HOME/.local" @johnnymorganz/stylua-bin@2.5.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Some hook repos download their binary at build time (shellcheck-py,
      # shfmt), which flakes when upstream hosts hiccup. Cache the built hook
      # environments so downloads happen once per config change.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # prek downloads the exact hook versions pinned in .pre-commit-config.yaml;
      # StyLua is the intentional system-hook exception and is installed above.
      - name: Run all hooks
        run: uvx prek run --all-files --show-diff-on-failure
