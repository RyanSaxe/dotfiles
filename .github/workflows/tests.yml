name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install shell runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Run tests
        run: uv run --with pytest --with pyyaml --with ruamel.yaml --with tiktoken pytest tests
