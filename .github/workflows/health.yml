name: health

# "Does a fresh box come up?" — the installer's symlink shape, shell
# syntax, and the theme render, verified on both OSes without real
# package installs.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  health:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stow and zsh
        run: |
          # install.sh's stow verb upgrades a too-old stow itself
          # (ensure_modern_stow), so no version handling here.
          if [ "$RUNNER_OS" = macOS ]; then
            brew install stow
          else
            sudo apt-get update -q
            sudo apt-get install -y stow zsh
          fi
          stow --version | head -n 1

      - name: Stow packages contain only dot- entries
        run: |
          # Everything inside a package deploys into HOME, so a non-dot
          # entry links a literal name there (a tests/ dir once linked
          # ~/tests). Checks every tier regardless of OS.
          bad=""
          for pkg in $(cat tiers/*.txt); do
            for entry in $(ls -A "$pkg"); do
              case "$entry" in dot-*) ;; *) bad="$bad $pkg/$entry" ;; esac
            done
          done
          for path in $bad; do
            echo "::error::stow package entry without dot- prefix: $path"
          done
          [ -z "$bad" ]

      - name: install.sh stows every tier into a scratch home
        run: |
          # The installer's own stow path — stow_package, manifests,
          # cleanup — not a re-implementation of it.
          scratch="$(mktemp -d)"
          echo "SCRATCH=$scratch" >> "$GITHUB_ENV"
          HOME="$scratch" ./install.sh stow

      - name: Restow cleans junk, removed files, and de-tiered packages
        run: |
          clone="$(mktemp -d)/clone"
          home="$(mktemp -d)"
          git clone -q . "$clone"
          cd "$clone"

          # Gitignored junk inside a package is deleted, never linked.
          mkdir -p theme/tests/__pycache__
          touch theme/tests/__pycache__/junk.pyc
          HOME="$home" ./install.sh stow core
          [ ! -e "$home/tests" ]
          [ ! -e theme/tests ]

          # Untracked files inside a package refuse to stow.
          touch zsh/dot-config/zsh/wip.zsh
          if HOME="$home" ./install.sh stow core; then
            echo "::error::untracked package file did not refuse to stow"
            exit 1
          fi
          rm zsh/dot-config/zsh/wip.zsh

          # A removed file loses its link and its emptied directory chain.
          git rm -q theme/dot-config/theme/templates/*.tmpl
          HOME="$home" ./install.sh stow core
          [ ! -e "$home/.config/theme/templates" ]

          # A package dropped from every tier is unstowed entirely.
          grep -v '^workmux$' tiers/core.txt > tiers/core.tmp
          mv tiers/core.tmp tiers/core.txt
          HOME="$home" ./install.sh stow core
          [ ! -e "$home/.config/workmux" ]

      - name: Key targets resolve
        run: |
          paths=".zshrc .config/tmux/tmux.conf .local/bin/theme .local/bin/rail"
          if [ "$RUNNER_OS" = macOS ]; then
            paths="$paths .config/ghostty/config"
          fi
          for path in $paths; do
            if [ ! -e "$SCRATCH/$path" ]; then
              echo "::error::missing $path after stow"
              exit 1
            fi
          done

      - name: zsh syntax
        run: |
          find zsh -type f \( -name 'dot-zsh*' -o -name '*.zsh' \) \
            -exec zsh -n {} +

      - name: Theme renders with no unresolved tokens
        run: |
          HOME="$SCRATCH" XDG_STATE_HOME="$SCRATCH/.local/state" \
            "$SCRATCH/.local/bin/theme" apply
          test -s "$SCRATCH/.local/state/dotfiles/generated/tuis-colors.json"
          test -s "$SCRATCH/.config/bat/themes/Dotfiles.tmTheme"
          ! grep -q '{{' "$SCRATCH/.config/bat/themes/Dotfiles.tmTheme"
          # Diverge the layers through the real CLI, exercising the mode
          # persistence and per-layer render paths end to end. The mixed
          # render's contract: inner-prefixed tokens resolve against the
          # inner palette, outer-prefixed against the outer. Expected hexes
          # come from the palette files, so retuning a color never fails
          # this check.
          HOME="$SCRATCH" XDG_STATE_HOME="$SCRATCH/.local/state" \
            "$SCRATCH/.local/bin/theme" inner light
          HOME="$SCRATCH" XDG_STATE_HOME="$SCRATCH/.local/state" \
            "$SCRATCH/.local/bin/theme" outer dark
          inner_bg="$(sed -n 's/^base=//p' theme/dot-config/theme/palettes/latte.conf)"
          outer_crust="$(sed -n 's/^crust=//p' theme/dot-config/theme/palettes/mocha.conf)"
          test -n "$inner_bg" && test -n "$outer_crust"
          grep -qF "set -g @bg \"$inner_bg\"" \
            "$SCRATCH/.local/state/dotfiles/generated/tmux-colors.conf"
          grep -qF "set -g @crust \"$outer_crust\"" \
            "$SCRATCH/.local/state/dotfiles/generated/tmux-colors.conf"

      - name: Generated artifacts stay out of the checkout
        run: |
          # theme publishes generated files into the scratch home. A publish
          # directory that stow folded into a package symlink would receive
          # them inside the checkout instead.
          repo="$(pwd -P)"
          for path in .config/bat/themes .config/ghostty/shaders .config/ghostty/themes; do
            resolved="$(cd "$SCRATCH/$path" && pwd -P)"
            case "$resolved" in
            "$repo"/*)
              echo "::error::$path resolves into the checkout: $resolved"
              exit 1
              ;;
            esac
          done
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::stow + theme apply wrote into the checkout"
            exit 1
          fi

  # "Does the editor come up?" — the nvim package restores its locked
  # plugins headlessly and checkhealth reports no errors. Unlike the
  # health job this one installs real packages (neovim itself).
  nvim:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install neovim
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install neovim
          else
            curl -fsSL https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz |
              sudo tar -xz -C /usr/local --strip-components=1
          fi
          nvim --version | head -n 1

      - name: Headless bootstrap from the lockfile
        run: |
          mkdir -p "$HOME/.config"
          ln -s "$PWD/nvim/dot-config/nvim" "$HOME/.config/nvim"
          # First boot installs plugins at their locked versions, then mason
          # and treesitter finish tool installs in the background; quitting
          # early aborts them, so give the boot a settle window.
          nvim --headless \
            "+lua vim.defer_fn(function() vim.cmd('qa!') end, 120000)"

      - name: Lua typecheck (strict)
        if: runner.os == 'macOS'
        run: |
          # Types are OS-independent; one matrix leg carries the check.
          # Runs after bootstrap so installed plugins serve as typed
          # libraries (blink, snacks, LazyVim classes).
          brew install lua-language-server
          nvim -l dev/luals-check.lua

      - name: every lua function documents its signature
        run: nvim -l dev/annotation-check.lua

      # The acceptance criterion the other two cannot check: what a real
      # editor shows.
      - name: the editor reports no diagnostics
        # Warm up first: a cold runner installs treesitter parsers on the
        # first real session, and no language server attaches until that
        # finishes.
        run: |
          nvim --headless "+Lazy! sync" "+qa" || true
          nvim --headless -c "luafile dev/editor-parity.lua"

      - name: checkhealth reports no errors
        run: |
          nvim --headless "+silent checkhealth lazy" \
            "+silent w! /tmp/health.txt" +qa
          cat /tmp/health.txt
          if grep -q "ERROR" /tmp/health.txt; then
            echo "::error::checkhealth reported errors"
            exit 1
          fi
