name: health

# "Does a fresh box come up?" — the installer's symlink shape, shell
# syntax, and the theme render, verified on both OSes without real
# package installs.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  health:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and zsh
        run: |
          # uvx runs dotbot itself, so the deployment tool needs no install
          # step of its own.
          if [ "$RUNNER_OS" = macOS ]; then
            command -v uvx >/dev/null || brew install uv
          else
            sudo apt-get update -q
            sudo apt-get install -y zsh
            command -v uvx >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: install.sh deploys every tier into a scratch home
        run: |
          # The installer's own deploy path — junk cleanup, the untracked
          # guard, dotbot — not a re-implementation of it.
          scratch="$(mktemp -d)"
          echo "SCRATCH=$scratch" >> "$GITHUB_ENV"
          HOME="$scratch" ./install.sh links

      - name: Redeploy cleans junk and removed files
        run: |
          clone="$(mktemp -d)/clone"
          home="$(mktemp -d)"
          git clone -q . "$clone"
          cd "$clone"

          # Gitignored junk inside a source tree is deleted, never linked.
          mkdir -p theme/tests/__pycache__
          touch theme/tests/__pycache__/junk.pyc
          HOME="$home" ./install.sh links core
          [ ! -e "$home/tests" ]
          [ ! -e theme/tests ]

          # Untracked files inside a source tree refuse to deploy.
          touch zsh/wip.zsh
          if HOME="$home" ./install.sh links core; then
            echo "::error::untracked source file did not refuse to deploy"
            exit 1
          fi
          rm zsh/wip.zsh

          # A removed file loses its link: dotbot's clean directive removes
          # dead links pointing into the repo, so none survive a redeploy.
          git rm -q theme/templates/*.tmpl
          HOME="$home" ./install.sh links core
          dangling="$(find "$home/.config" -type l ! -exec test -e {} \; -print)"
          if [ -n "$dangling" ]; then
            printf '%s\n' "$dangling"
            echo "::error::dangling links survived a redeploy"
            exit 1
          fi

      - name: A legacy per-file layout upgrades to directory links
        run: |
          # Every other check here starts from an empty home, which is the one
          # shape that can never catch an upgrade going wrong. This one starts
          # from the layout an already-installed machine has: a real directory
          # of per-file links where a single directory link now belongs. That
          # shape is built by hand rather than checked out of git history,
          # because once this is the history there would be nothing to test.
          clone="$(mktemp -d)/clone"
          home="$(mktemp -d)"
          git clone -q . "$clone"
          cd "$clone"

          mkdir -p "$home/.config/nvim/lua/plugins"
          ln -s "$clone/nvim/init.lua" "$home/.config/nvim/init.lua"
          ln -s "$clone/nvim/lua/plugins/picker.lua" "$home/.config/nvim/lua/plugins/picker.lua"

          HOME="$home" ./install.sh links core
          if [ ! -L "$home/.config/nvim" ]; then
            echo "::error::a legacy directory did not convert to a link"
            exit 1
          fi
          # Hidden files needed their own map entry under the old globbing.
          if [ ! -f "$home/.config/nvim/.luarc.json" ]; then
            echo "::error::hidden file unreachable through the directory link"
            exit 1
          fi

          # The whole point: a file written into the repo is live immediately,
          # with no deploy step between writing it and a program reading it.
          touch "$clone/nvim/lua/plugins/__probe.lua"
          if [ ! -f "$home/.config/nvim/lua/plugins/__probe.lua" ]; then
            echo "::error::a new repo file was not live without a redeploy"
            exit 1
          fi
          rm "$clone/nvim/lua/plugins/__probe.lua"

          # Converting means deleting a directory, so it stops at anything it
          # did not put there instead of taking the file with it.
          rm "$home/.config/nvim"
          mkdir -p "$home/.config/nvim"
          ln -s "$clone/nvim/init.lua" "$home/.config/nvim/init.lua"
          echo data > "$home/.config/nvim/keepme.txt"
          if HOME="$home" ./install.sh links core; then
            echo "::error::deploy converted a directory holding a real file"
            exit 1
          fi
          if [ ! -f "$home/.config/nvim/keepme.txt" ]; then
            echo "::error::the real file was deleted by the conversion"
            exit 1
          fi

      - name: Key targets resolve
        run: |
          paths=".zshrc .config/tmux/tmux.conf .local/bin/theme .local/bin/rail .local/bin/attention"
          if [ "$RUNNER_OS" = macOS ]; then
            paths="$paths .config/ghostty/config"
          fi
          for path in $paths; do
            if [ ! -e "$SCRATCH/$path" ]; then
              echo "::error::missing $path after deploy"
              exit 1
            fi
          done

      - name: zsh syntax
        run: |
          find zsh -type f \( -name 'zshrc' -o -name 'zshenv' -o -name '*.zsh' \) \
            -exec zsh -n {} +

      - name: Theme renders with no unresolved tokens
        run: |
          HOME="$SCRATCH" XDG_STATE_HOME="$SCRATCH/.local/state" \
            "$SCRATCH/.local/bin/theme" apply
          test -s "$SCRATCH/.local/state/dotfiles/generated/tuis-colors.json"
          test -s "$SCRATCH/.config/bat/themes/Dotfiles.tmTheme"
          ! grep -q '{{' "$SCRATCH/.config/bat/themes/Dotfiles.tmTheme"
          # Diverge the layers through the real CLI, exercising the mode
          # persistence and per-layer render paths end to end. The mixed
          # render's contract: inner-prefixed tokens resolve against the
          # inner palette, outer-prefixed against the outer. Expected hexes
          # come from the palette files, so retuning a color never fails
          # this check.
          HOME="$SCRATCH" XDG_STATE_HOME="$SCRATCH/.local/state" \
            "$SCRATCH/.local/bin/theme" inner light
          HOME="$SCRATCH" XDG_STATE_HOME="$SCRATCH/.local/state" \
            "$SCRATCH/.local/bin/theme" outer dark
          inner_bg="$(sed -n 's/^base=//p' theme/palettes/latte.conf)"
          outer_crust="$(sed -n 's/^crust=//p' theme/palettes/mocha.conf)"
          test -n "$inner_bg" && test -n "$outer_crust"
          grep -qF "set -g @bg \"$inner_bg\"" \
            "$SCRATCH/.local/state/dotfiles/generated/tmux-colors.conf"
          grep -qF "set -g @crust \"$outer_crust\"" \
            "$SCRATCH/.local/state/dotfiles/generated/tmux-colors.conf"

      - name: Generated artifacts stay out of the checkout
        run: |
          # theme publishes generated files into the scratch home. A publish
          # directory deployed as a link into the repo (instead of the real
          # directory the tier map creates) would receive them inside the
          # checkout instead.
          repo="$(pwd -P)"
          for path in .config/bat/themes .config/ghostty/shaders .config/ghostty/themes; do
            resolved="$(cd "$SCRATCH/$path" && pwd -P)"
            case "$resolved" in
            "$repo"/*)
              echo "::error::$path resolves into the checkout: $resolved"
              exit 1
              ;;
            esac
          done
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::deploy + theme apply wrote into the checkout"
            exit 1
          fi

  # "Does the editor come up?" — the nvim package restores its locked
  # plugins headlessly and checkhealth reports no errors. Unlike the
  # health job this one installs real packages (neovim itself).
  nvim:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install neovim
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install neovim
          else
            curl -fsSL https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz |
              sudo tar -xz -C /usr/local --strip-components=1
          fi
          nvim --version | head -n 1

      - name: Headless bootstrap from the lockfile
        run: |
          mkdir -p "$HOME/.config"
          ln -s "$PWD/nvim" "$HOME/.config/nvim"
          # First boot installs plugins at their locked versions, then mason
          # and treesitter finish tool installs in the background; quitting
          # early aborts them, so give the boot a settle window.
          nvim --headless \
            "+lua vim.defer_fn(function() vim.cmd('qa!') end, 120000)"

      - name: Lua typecheck (strict)
        if: runner.os == 'macOS'
        run: |
          # Types are OS-independent; one matrix leg carries the check.
          # Runs after bootstrap so installed plugins serve as typed
          # libraries (blink, snacks, LazyVim classes).
          brew install lua-language-server
          nvim -l ci/luals-check.lua

      - name: every lua function documents its signature
        run: nvim -l ci/annotation-check.lua

      # ci/editor-parity.lua is deliberately NOT run here. It needs a warm
      # editor with a language server actually attached, and a cold runner
      # never gets one inside any sane budget — it spends its first minute
      # compiling treesitter parsers, and lua_ls never arrives. The check
      # refuses to report "clean" when it could not verify, so in CI it can
      # only ever fail. It runs as a pre-commit hook instead, on machines
      # that have the editor it is checking.

      - name: checkhealth reports no errors
        run: |
          nvim --headless "+silent checkhealth lazy" \
            "+silent w! /tmp/health.txt" +qa
          cat /tmp/health.txt
          if grep -q "ERROR" /tmp/health.txt; then
            echo "::error::checkhealth reported errors"
            exit 1
          fi
