name: health

# "Does a fresh box come up?" — the installer's symlink shape, shell
# syntax, and the theme render, verified on both OSes without real
# package installs.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  health:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stow and zsh
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install stow
          else
            sudo apt-get update -q
            sudo apt-get install -y stow zsh
            # apt's 2.3.x breaks on --dotfiles dot- directories (fixed in
            # 2.4); build the release tarball over it, as install.sh does.
            if stow --version | grep -q 'version 2\.[0-3]\.'; then
              build="$(mktemp -d)"
              curl -fsSL https://ftp.gnu.org/gnu/stow/stow-2.4.1.tar.gz |
                tar -xz -C "$build"
              (cd "$build/stow-2.4.1" && ./configure && sudo make install) >/dev/null
            fi
          fi
          stow --version | head -n 1

      - name: Stow every tier into a scratch home
        run: |
          scratch="$(mktemp -d)"
          echo "SCRATCH=$scratch" >> "$GITHUB_ENV"
          tiers="tiers/core.txt"
          if [ "$RUNNER_OS" = macOS ]; then tiers="$tiers tiers/mac.txt"; fi
          # shellcheck disable=SC2086
          cat $tiers | while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            echo "stow: $pkg"
            stow --dotfiles -t "$scratch" "$pkg"
          done

      - name: Key targets resolve
        run: |
          paths=".zshrc .config/tmux/tmux.conf .local/bin/theme .local/bin/rail"
          if [ "$RUNNER_OS" = macOS ]; then
            paths="$paths .config/ghostty/config"
          fi
          for path in $paths; do
            if [ ! -e "$SCRATCH/$path" ]; then
              echo "::error::missing $path after stow"
              exit 1
            fi
          done

      - name: zsh syntax
        run: |
          find zsh -type f \( -name 'dot-zsh*' -o -name '*.zsh' \) \
            -exec zsh -n {} +

      - name: Theme renders with no unresolved tokens
        run: |
          HOME="$SCRATCH" XDG_STATE_HOME="$SCRATCH/.local/state" \
            "$SCRATCH/.local/bin/theme" apply
          test -s "$SCRATCH/.local/state/dotfiles/generated/tuis-colors.json"
          test -s "$SCRATCH/.config/bat/themes/Dotfiles.tmTheme"
          ! grep -q '{{' "$SCRATCH/.config/bat/themes/Dotfiles.tmTheme"
          printf 'light\n' > "$SCRATCH/.local/state/dotfiles/inner-mode"
          printf 'dark\n' > "$SCRATCH/.local/state/dotfiles/outer-mode"
          HOME="$SCRATCH" XDG_STATE_HOME="$SCRATCH/.local/state" \
            "$SCRATCH/.local/bin/theme" apply
          grep -q 'set -g @bg "#eff1f5"' \
            "$SCRATCH/.local/state/dotfiles/generated/tmux-colors.conf"
          grep -q 'set -g @crust "#11111b"' \
            "$SCRATCH/.local/state/dotfiles/generated/tmux-colors.conf"

  # "Does the editor come up?" — the nvim package restores its locked
  # plugins headlessly and checkhealth reports no errors. Unlike the
  # health job this one installs real packages (neovim itself).
  nvim:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install neovim
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install neovim
          else
            curl -fsSL https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz |
              sudo tar -xz -C /usr/local --strip-components=1
          fi
          nvim --version | head -n 1

      - name: Headless bootstrap from the lockfile
        run: |
          mkdir -p "$HOME/.config"
          ln -s "$PWD/nvim/dot-config/nvim" "$HOME/.config/nvim"
          # First boot installs plugins at their locked versions, then mason
          # and treesitter finish tool installs in the background; quitting
          # early aborts them, so give the boot a settle window.
          nvim --headless \
            "+lua vim.defer_fn(function() vim.cmd('qa!') end, 120000)"

      - name: checkhealth reports no errors
        run: |
          nvim --headless "+silent checkhealth lazy" \
            "+silent w! /tmp/health.txt" +qa
          cat /tmp/health.txt
          if grep -q "ERROR" /tmp/health.txt; then
            echo "::error::checkhealth reported errors"
            exit 1
          fi
