# prek runs these before each commit, and CI runs `prek run --all-files`.
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        # CI's checkout stages nothing, so check every file it is given.
        args: [--enforce-all]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.6
    hooks:
      - id: rumdl-check
        args: [--fix]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        # Keep ruff-format on code files so prose examples in Markdown stay aligned.
        types_or: [python, pyi, jupyter]

  - repo: local
    hooks:
      - id: max-file-lines
        name: max-file-lines
        # Hard 1,000-line cap on source files; skips lockfiles, generated,
        # minified, SVG, JSON, data and Markdown files.
        entry: >-
          python3 -c 'import pathlib, re, sys;
          skip_ext = {".lock", ".svg", ".json", ".jsonc", ".csv", ".tsv", ".jsonl", ".ndjson", ".sql", ".xml", ".md", ".mdx", ".markdown", ".map", ".snap", ".po", ".pot"};
          skip_re = re.compile(r"(^|/)([^/]+-lock\.[^/]+|[^/]+\.(min|generated|gen)\.[^/]+|[^/]+_pb2\.py|[^/]+\.pb\.go)$");
          bad = [];
          [bad.append((p, n)) for p in sys.argv[1:]
           if pathlib.Path(p).suffix.lower() not in skip_ext and not skip_re.search(p)
           and (n := sum(1 for _ in pathlib.Path(p).open("rb"))) > 1000];
          [print(f"{p}: {n} lines (limit 1000) - split this file along a domain boundary.", file=sys.stderr) for p, n in bad];
          sys.exit(1 if bad else 0)'
        language: python
        types: [text]

      - id: nixfmt
        name: nixfmt
        entry: nix fmt --
        language: system
        files: \.nix$
        # One nix process at a time, or each waits on the flake lock.
        require_serial: true

      - id: deadnix
        name: deadnix
        entry: deadnix --fail
        language: system
        files: \.nix$

      - id: statix
        name: statix
        entry: statix check
        language: system
        files: \.nix$
        pass_filenames: false

      - id: ty
        name: ty
        # theme/desktop.py imports numpy and pillow from the Nix Python env.
        entry: uvx --with numpy --with pillow ty@0.0.105 check
        language: system
        types: [python]
        pass_filenames: false

      - id: stylua
        name: stylua
        entry: stylua
        language: system
        files: \.lua$

      - id: emmylua-check
        name: emmylua-check
        entry: >-
          sh -c 'VIMRUNTIME="$(nvim --clean --headless -u NONE +"lua io.write(vim.env.VIMRUNTIME)" +q)"
          emmylua_check -c .emmyrc.json --severity error config/nvim config/rex pkgs/ws/mux'
        language: system
        files: (\.lua$|^\.emmyrc\.json$)
        pass_filenames: false

      - id: luacheck-complexity
        name: luacheck (complexity)
        # Only code 561 (cyclomatic complexity); emmylua_check owns static analysis.
        entry: luacheck --no-config --only 561 --max-cyclomatic-complexity 10
        language: system
        files: \.lua$

      - id: nvim-queries
        name: Neovim's context queries parse
        entry: nvim --clean --headless -l config/nvim/scripts/check-queries.lua config/nvim
        language: system
        files: ^config/nvim/(queries/|scripts/check-queries\.lua$)
        pass_filenames: false

      - id: shfmt
        name: shfmt
        entry: shfmt --write --indent 2
        language: system
        types: [shell]
        # shfmt has no zsh dialect.
        exclude: '\.zsh$|^config/zsh/zshrc(\.minimal)?$'

      - id: shellcheck
        name: shellcheck
        # Check POSIX sh, bash and dash scripts; skip zsh scripts.
        entry: >-
          sh -c 'rc=0; for f in "$@"; do
            case "$f" in *.zsh) continue ;; esac
            case "$(head -n 1 "$f")" in *zsh*) continue ;; esac
            shellcheck "$f" || rc=1
          done; exit $rc' --
        language: system
        types: [shell]

      - id: zsh-syntax
        name: zsh syntax check
        entry: >-
          sh -c 'rc=0; for f in "$@"; do
            case "$f" in
              *.zsh|config/zsh/zshrc|config/zsh/zshrc.minimal) zsh -n "$f" || rc=1 ;;
              *) case "$(head -n 1 "$f")" in *zsh*) zsh -n "$f" || rc=1 ;; esac ;;
            esac
          done; exit $rc' --
        language: system
        files: (\.zsh$|\.sh$|^config/zsh/zshrc(\.minimal)?$|^config/sketchybar/sketchybarrc$)

      - id: ws
        name: golangci-lint and go test (ws)
        entry: sh -c 'cd pkgs/ws && golangci-lint fmt && golangci-lint run && go test ./...'
        language: system
        files: ^pkgs/ws/
        pass_filenames: false

      - id: prompt
        name: pytest (prompt and theme)
        entry: uv run --no-project --with pytest pytest -q tests/zsh
        language: system
        files: ^(config/zsh/prompt-segments\.sh|theme/theme\.sh|tests/zsh/)
        pass_filenames: false
