# The single source of truth for code quality gates.
#
# Run by prek locally on commit and by CI via `prek run --all-files` — the same
# pinned versions in both places, downloaded by prek itself, so hook and CI can
# never disagree. Formatters FIX files rather than reject them: a version skew
# against the editor's on-save formatter shows up as a silent reformat, never a
# blocked commit.
#
# Editor parity: nvim resolves project-local tools first (.venv/bin via
# venv.zsh, node_modules/.bin via conform), then globals. See
# docs/v2-plan.md#toolchain.

fail_fast: false

repos:
  # Basic hygiene, mirrors .editorconfig.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files

  # ------------------------------------------------------------------ Lua
  # Typecheck lives in the local-hooks section (luals-check): the same
  # lua-language-server the editor runs, strict mode, so annotations are
  # required — Lua's tsc --noEmit.
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua-github

  # --------------------------------------------------------------- Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]
      # Extensionless uv scripts (PEP 723 shebangs) are invisible to the
      # `types: python` filter; list them explicitly so they stay gated.
      - id: ruff-format
        alias: ruff-format-uv-scripts
        name: ruff format (uv scripts)
        types_or: [file]
        files: "^theme/dot-local/bin/mascot-accents$"
      - id: ruff-check
        alias: ruff-check-uv-scripts
        name: ruff check (uv scripts)
        args: [--fix]
        types_or: [file]
        files: "^theme/dot-local/bin/mascot-accents$"

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.72
    hooks:
      - id: ty

  # ---------------------------------------------------------------- Shell
  # POSIX sh only — zsh interactive config is deliberately unlinted
  # (shellcheck has no zsh dialect; see docs/v2-plan.md#shell-language-split).
  # sketchybar's plugins and the workmux helpers are zsh too
  # (shebang, not extension), same reason.
  # zsh/ is excluded per-file, not as a tree: prompt-segments.sh lives there
  # but is POSIX (dash) and stays gated.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: '\.zsh$|^zsh/dot-zshrc$|^zsh/dot-zshenv$|^sketchybar/|^workmux/dot-local/bin/workmux-(escalate-idle|copy-ignored)$'

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [--write, --indent, "2"]
        exclude: '\.zsh$|^zsh/dot-zshrc$|^zsh/dot-zshenv$|^workmux/dot-local/bin/workmux-(escalate-idle|copy-ignored)$'

  # ------------------------------------------- Web / Markdown / JSON / YAML
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [html, css, javascript, ts, json, yaml, markdown]
        # lazy.nvim owns its lockfile's formatting and rewrites it on
        # every sync; reformatting it here is perpetual churn.
        exclude: lazy-lock\.json$

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint

  # ----------------------------------------------------------------- TOML
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  # oxlint has no hook repo; pin via npm instead. prek installs this exact
  # version into an isolated env — same everywhere, including CI.
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        language: node
        additional_dependencies: ["oxlint@1.12.0"]
        entry: oxlint
        types_or: [javascript, ts]

      # Typecheck with the rail's OWN pinned toolchain (package-lock is
      # the version pin; tsc resolves @types project-relative, so a
      # hook-env compiler can't see them). Skips cleanly where node isn't
      # installed — node tooling is not core.
      - id: rail-typecheck
        name: tsc (rail)
        language: system
        entry: sh
        args:
          [
            "-c",
            "command -v npm >/dev/null 2>&1 || exit 0; cd tuis/rail && { [ -d node_modules ] || npm ci --silent --no-audit --no-fund; } && npx tsc --noEmit",
          ]
        pass_filenames: false
        files: "^tuis/rail/"

      # The rail's behavioral test: the visit-clears ack lifecycle,
      # against a throwaway state dir.
      - id: rail-ackcheck
        name: ackcheck (rail)
        language: node
        additional_dependencies: ["tsx@4.19.2"]
        entry: sh
        args:
          ["-c", "XDG_STATE_HOME=$(mktemp -d) tsx tuis/rail/dev/ackcheck.ts"]
        pass_filenames: false
        files: "^tuis/rail/"

      # The rail's attention routing: presence, terminal focus, and the
      # transition/departure-sweep phone batch.
      - id: rail-attncheck
        name: attncheck (rail)
        language: node
        additional_dependencies: ["tsx@4.19.2"]
        entry: sh
        args: ["-c", "tsx tuis/rail/dev/attncheck.ts"]
        pass_filenames: false
        files: "^tuis/rail/"

      # The idle_prompt escalation hook flips working→waiting and nothing
      # else. Skips cleanly where zsh isn't installed.
      - id: escalate-check
        name: escalate-check (workmux hook)
        language: system
        entry: sh
        args:
          [
            "-c",
            "command -v zsh >/dev/null 2>&1 || exit 0; sh dev/escalate-check.sh",
          ]
        pass_filenames: false
        files: "^(workmux/dot-local/bin/workmux-escalate-idle|dev/escalate-check\\.sh)$"

      # New worktrees receive copies of every ignored file, including nested
      # data and dotfiles, without copying unrelated untracked files.
      - id: workmux-copy-ignored-check
        name: copy ignored files (workmux hook)
        language: system
        entry: zsh dev/workmux-copy-ignored-check.zsh
        pass_filenames: false
        files: "^(workmux/dot-local/bin/workmux-copy-ignored|workmux/dot-config/workmux/config\\.yaml|dev/workmux-copy-ignored-check\\.zsh)$"

      # Strict Lua typecheck (no-unknown: annotations are required), same
      # engine and .luarc.json as the editor. Skips cleanly where nvim
      # or lua-language-server is missing — the Lua toolchain is mac-only
      # (see install.sh); CI installs it explicitly.
      - id: luals-check
        name: luals --check (nvim)
        language: system
        entry: sh
        args:
          [
            "-c",
            "command -v nvim >/dev/null 2>&1 || exit 0; nvim -l dev/luals-check.lua",
          ]
        pass_filenames: false
        files: '^(nvim/.*\.lua|nvim/dot-config/nvim/\.luarc\.json|dev/luals-check\.lua)$'

      # LuaLS reports what it cannot INFER; it says nothing about an
      # inferable-but-undocumented function. This is the other half:
      # every parameter named in a ---@param, every value-returning
      # function carrying a ---@return.
      - id: annotation-check
        name: annotation coverage (lua)
        language: system
        entry: sh
        args:
          [
            "-c",
            "command -v nvim >/dev/null 2>&1 || exit 0; nvim -l dev/annotation-check.lua",
          ]
        pass_filenames: false
        files: '^(nvim/.*\.lua|dev/.*\.lua)$'

      # The one check that opens a real editor. `.luarc.json` must never
      # name libraries: LuaLS gives it precedence over client settings, so
      # a stale entry there silently overrides lazydev and the editor goes
      # blind while this repo's other Lua checks stay green.
      - id: editor-parity
        name: editor parity (lua)
        language: system
        entry: sh
        args:
          [
            "-c",
            "command -v nvim >/dev/null 2>&1 || exit 0; nvim --headless -c 'luafile dev/editor-parity.lua'",
          ]
        pass_filenames: false
        files: '^(nvim/.*\.lua|nvim/dot-config/nvim/\.luarc\.json|dev/editor-parity\.lua)$'

      # The keybind cheatsheet (alt+/) can never drift: every chord bound
      # in tmux.conf and aerospace.toml must have a keys.tsv row.
      - id: keycheck
        name: keycheck (cheatsheet drift)
        language: system
        entry: uv run -q --script dev/keycheck.py
        pass_filenames: false
        files: '^(tmux/dot-config/tmux/(tmux\.conf|keys\.tsv)|aerospace/dot-config/aerospace/aerospace\.toml|ghostty/dot-config/ghostty/config|zsh/dot-zshrc|dev/keycheck\.py)$'

      # The global AI layer stays additive: authored skills/config are valid,
      # and no mutable harness or third-party state enters the repository.
      - id: ai-harness-check
        name: ai-harness contract
        language: system
        entry: uv run -q --script dev/ai-harness-check.py
        pass_filenames: false
        files: '^(ai-harness/|dev/ai-harness-check\.py$)'

      # Theme unit tests. uv resolves the environment, so this runs
      # identically locally and in CI.
      - id: theme-tests
        name: pytest (theme)
        language: system
        entry: uv run --no-project --with pytest --with pillow pytest -q tests/theme
        pass_filenames: false
        files: "^theme/|^tests/theme/"
