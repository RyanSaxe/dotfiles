# prek runs these before each commit, and CI runs `prek run --all-files`.
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nix fmt --
        language: system
        files: \.nix$
        # One nix process at a time, or each waits on the flake lock.
        require_serial: true
