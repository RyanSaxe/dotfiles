# prek runs these before each commit, and CI runs `prek run --all-files`.
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nix fmt --
        language: system
        files: \.nix$
        # One nix process at a time, or each waits on the flake lock.
        require_serial: true

      - id: stylua
        name: stylua
        entry: stylua
        language: system
        files: ^config/(nvim|rex)/.*\.lua$

      - id: shfmt
        name: shfmt
        entry: shfmt --write --indent 2
        language: system
        types: [shell]
        # shfmt has no zsh dialect.
        exclude: '\.zsh$|^config/zsh/zshrc(\.minimal)?$'

      - id: ws
        name: gofmt, go vet and go test (ws)
        entry: sh -c 'cd pkgs/ws && test -z "$(gofmt -l .)" && go vet ./... && go test ./...'
        language: system
        files: ^pkgs/ws/
        pass_filenames: false

      - id: prompt
        name: pytest (prompt)
        entry: uv run --no-project --with pytest pytest -q tests/zsh
        language: system
        files: ^(config/zsh/prompt-segments\.sh|tests/zsh/)
        pass_filenames: false
