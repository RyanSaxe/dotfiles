; TokyoNight Night theme for fast-syntax-highlighting
; Balanced variant - cyan/blue/purple palette, muted values
;
; Color usage:
;   purple:  #9d7cd8  - commands, keywords, control flow
;   blue:    #7aa2f7  - default, variables, expansions
;   cyan:    #7dcfff  - paths, flags
;   muted:   #9099b7  - strings, values, numbers
;   comment: #545c7e  - comments only
;   red:     #f7768e  - errors only

[base]
default          = #7aa2f7
unknown-token    = #f7768e
commandseparator = #9d7cd8
redirection      = #9d7cd8
here-string-tri  = #9099b7
here-string-text = #9099b7
here-string-var  = #7aa2f7
exec-descriptor  = #9099b7
comment          = #545c7e
correct-subtle   = #7aa2f7
incorrect-subtle = #f7768e
subtle-separator = #9d7cd8
subtle-bg        = none
secondary        = free
recursive-base   = #9d7cd8

[command-point]
; Commands and control flow use purple
reserved-word  = #9d7cd8
subcommand     = #9d7cd8
alias          = #9d7cd8
suffix-alias   = #9d7cd8
global-alias   = #9d7cd8
builtin        = #9d7cd8
function       = #9d7cd8
command        = #9d7cd8
precommand     = #9d7cd8
hashed-command = #9d7cd8
single-sq-bracket = #9d7cd8
double-sq-bracket = #9d7cd8
double-paren   = #9d7cd8

[paths]
; Paths use cyan
path          = #7dcfff
pathseparator = #7aa2f7
path-to-dir   = #7dcfff,underline
globbing      = #7aa2f7
globbing-ext  = #7aa2f7

[brackets]
paired-bracket = #7aa2f7
bracket-level-1 = #9d7cd8
bracket-level-2 = #7aa2f7
bracket-level-3 = #7dcfff

[arguments]
; Flags use cyan, strings use muted (brighter than comments)
single-hyphen-option   = #7dcfff
double-hyphen-option   = #7dcfff
back-quoted-argument   = #7aa2f7
single-quoted-argument = #9099b7
double-quoted-argument = #9099b7
dollar-quoted-argument = #9099b7
optarg-string          = #9099b7
optarg-number          = #9099b7

[in-string]
; Variables inside strings use blue
back-dollar-quoted-argument           = #7aa2f7
back-or-dollar-double-quoted-argument = #7aa2f7

[other]
; Variables and expansions use blue
variable             = #7aa2f7
assign               = #7aa2f7
assign-array-bracket = #9d7cd8
history-expansion    = #7aa2f7

[math]
mathvar = #7aa2f7
mathnum = #9099b7
matherr = #f7768e

[for-loop]
forvar = #7aa2f7
fornum = #9099b7
foroper = #9d7cd8
forsep = #9d7cd8

[case]
case-input       = #9d7cd8
case-parentheses = #9d7cd8
case-condition   = #7aa2f7
