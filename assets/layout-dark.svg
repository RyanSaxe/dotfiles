<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 388" role="img" aria-label="Dotfiles host, role, and module layout. hosts/mac.nix (aarch64-darwin) enables the gui, base, and personal roles. hosts/linux.nix (x86_64-linux) enables the base, personal, and rex-server roles. Each role enables its modules: gui enables ghostty, aerospace, sketchybar, karabiner, macos, darwin/macos, and darwin/homebrew; base enables zsh, git, tmux, neovim, packages, ws, agents, secrets, and darwin/codex; personal enables rex plus personal extras in agents, packages, and theme; rex-server enables the rex-server systemd user service.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3;text-anchor:middle;font-size:15px}
.h{font-size:12px;font-weight:600;fill:#9198a1;letter-spacing:0.06em}
.t{font-weight:600}.m{font-size:13.5px;font-weight:600}.s{font-size:12.5px;fill:#9198a1}
.line{fill:none;stroke:#e6edf3;stroke-width:1.5}.head{fill:#e6edf3}
.bline{fill:none;stroke:#6e8cf0;stroke-width:1.5}.bhead{fill:#6e8cf0}
.box{fill:#0d1117;stroke:#3d444d}.round{fill:#152042;stroke:#6e8cf0}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bhead"/></marker>
</defs>
<text x="108" y="28" class="h">HOSTS</text>
<text x="346" y="28" class="h">ROLES</text>
<text x="644" y="28" class="h">MODULES</text>
<rect class="box" x="20" y="68" width="176" height="76" rx="10"/>
<text x="108" y="101" class="t">hosts/mac.nix</text>
<text x="108" y="122" class="s">aarch64-darwin</text>
<rect class="box" x="20" y="236" width="176" height="76" rx="10"/>
<text x="108" y="269" class="t">hosts/linux.nix</text>
<text x="108" y="290" class="s">x86_64-linux</text>
<rect class="round" x="276" y="48" width="140" height="64" rx="10"/>
<text x="346" y="76" class="t">gui</text>
<text x="346" y="96" class="s">Mac desktop</text>
<rect class="round" x="276" y="132" width="140" height="64" rx="10"/>
<text x="346" y="160" class="t">base</text>
<text x="346" y="180" class="s">every computer</text>
<rect class="round" x="276" y="216" width="140" height="64" rx="10"/>
<text x="346" y="244" class="t">personal</text>
<text x="346" y="264" class="s">personal tools</text>
<rect class="round" x="276" y="300" width="140" height="64" rx="10"/>
<text x="346" y="328" class="t">rex-server</text>
<text x="346" y="348" class="s">Linux daemon</text>
<rect class="box" x="468" y="48" width="352" height="64" rx="10"/>
<text x="644" y="76" class="m">ghostty · aerospace · sketchybar · karabiner</text>
<text x="644" y="96" class="s">macos · darwin/macos · darwin/homebrew</text>
<rect class="box" x="468" y="132" width="352" height="64" rx="10"/>
<text x="644" y="160" class="m">zsh · git · tmux · neovim · packages</text>
<text x="644" y="180" class="s">ws · agents · secrets · darwin/codex</text>
<rect class="box" x="468" y="216" width="352" height="64" rx="10"/>
<text x="644" y="244" class="m">rex</text>
