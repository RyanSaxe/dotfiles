# tmux configuration.

# ----- terminal & environment ------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm-256color:RGB'
set -as terminal-features 'tmux-256color:RGB'
# Preserve COLORTERM so apps inside tmux (chalk, ink, etc.) emit 24-bit
# truecolor escapes instead of quantizing to 256 colors.
set-environment -g COLORTERM truecolor
# Claude Code checks LC_TERMINAL against a whitelist (ghostty/kitty/...)
# for advanced rendering; tmux normally hides the parent terminal.
set-environment -g LC_TERMINAL ghostty
set -g focus-events on
set -g escape-time 0
# Let applications' escape sequences (kitty graphics, OSC 52 clipboard)
# pass through tmux to the real terminal. Deliberately `on`, NOT `all`:
# with `all`, a HIDDEN pane (e.g. an nvim dashboard drawing its mascot
# sprite) paints images over whatever window is actually visible.
set -g allow-passthrough on

# ----- prefix & basics -------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on

# Index windows and panes from 1 (easier keyboard reach).
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g history-limit 10000

# Size windows to the most recently active client, not the smallest one:
# a phone attaching to a session must not shrink the desktop's windows to
# phone dimensions.
set -g window-size latest

# ----- status bar ------------------------------------------------------
# At the top, with an empty chrome row beneath it so panes start a row
# down. Windows sit on the left as square blocks and the session on the
# right. The accent marks the current window and a pressed prefix, and
# its second color marks a bell.
set -g status 2
set -g status-position top
set -g status-format[1] '#[bg=#{@chrome}]#{p-200:}'
set -g status-style 'fg=#{@fg},bg=#{@chrome}'
set -g status-left ''
set -g status-left-length 100
set -g status-right-length 100


# The formats below draw every state themselves, so tmux's own state styles
# (current underlined, bell and activity reversed) stay out of the way.
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-last-style default
set -g window-status-bell-style default
set -g window-status-activity-style default

# Other windows: one block in the faint color, or the bell color.
set -g @window_color '#{?window_bell_flag,#{@notify},#{@dim}}'
set -g window-status-format '#[fg=#{@chrome},bg=#{E:@window_color},bold] #I #[nobold] #W '
# The current window: its number on the accent, its name in the accent.
set -g window-status-current-format '#[fg=#{@chrome},bg=#{@accent},bold] #I #[fg=#{@accent},bg=#{@border}] #W #[nobold]'

# The session, truncated to 10 characters: accent while the prefix is
# down, the bell color while any of its windows rang, faint otherwise.
set -g @session_color '#{?client_prefix,#{@accent},#{?session_alerts,#{@notify},#{@dim}}}'
set -g status-right '#[fg=#{@chrome},bg=#{E:@session_color},bold] #{=10:session_name} #[nobold]'

# ----- panes, messages, copy-mode --------------------------------------
# The border channel is chrome, always, the same color as the bar: between
# two panes it reads as a solid chrome band. Painting the cell's
# BACKGROUND is what matters, since an unset bg takes the terminal
# default and shows up as a pale strip. Active and normal share one style:
# tmux hands shared borders to the active pane's style, so any difference
# paints moving lines.
set -g pane-border-style 'fg=#{@chrome},bg=#{@chrome}'
set -g pane-active-border-style 'fg=#{@chrome},bg=#{@chrome}'
set -g message-style "fg=#{@fg},bg=#{@bg_alt}"
set -g message-command-style "fg=#{@fg},bg=#{@bg_alt}"
set -g mode-style "fg=#{@fg},bg=#{@border}"

# ----- key bindings ----------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Smart pane switching aware of vim splits (hand-written vim-tmux-navigator
# binds; no plugin needed). Detection is a format, not a ps walk: a fork
# per keypress scales with the process table. Three OR'd layers:
#   1. #{pane_current_command} matching a bare vim/fzf name — tmux reports
#      the executable's own name, no path or process-state test needed (a
#      suspended vim hands the foreground to the shell, so its keys go to
#      tmux);
#   2. the @is_vim pane option nvim sets on enter/resume and clears on
#      leave/suspend, honored only while the command is NOT a plain shell
#      so a crashed nvim can never wedge navigation;
#   3. the @is_fzf pane option zsh's fzf widgets set, because fzf inside a
#      zle widget never becomes the pane's command.
# Accepted residual: a hand-typed `... | fzf` pipeline shows the shell as
# the command, so C-j/C-k select panes instead (arrows work inside fzf).
is_vim="#{||:#{m/ri:^g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}},#{||:#{&&:#{==:#{@is_vim},1},#{==:#{m/ri:^(zsh|bash|sh|fish)$,#{pane_current_command}},0}},#{==:#{@is_fzf},1}}}"
bind-key -n 'C-h' if-shell -F "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell -F "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell -F "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell -F "$is_vim" 'send-keys C-l'  'select-pane -R'

# Vim-style scrolling: pass through to vim, otherwise enter copy-mode.
# -e auto-exits copy-mode at the bottom. Full page (C-b/f) and half page
# (C-u/d) both bound for controlled scrolling.
bind-key -n 'C-b' if-shell -F "$is_vim" 'send-keys C-b' 'copy-mode -eu'
bind-key -n 'C-f' if-shell -F "$is_vim" 'send-keys C-f' 'copy-mode -e; send-keys C-f'
bind-key -n 'C-u' if-shell -F "$is_vim" 'send-keys C-u' 'copy-mode -e; send-keys C-u'
bind-key -n 'C-d' if-shell -F "$is_vim" 'send-keys C-d' 'copy-mode -e; send-keys C-d'

# tmux defaults displaced by the vim binds above.
bind l last-window
bind L switch-client -l

# Splits and windows inherit the current path.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# Mouse wheel: send to mouse-aware apps, otherwise scroll copy-mode.
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Vi copy mode.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ----- pane history: go back to the previous pane, across sessions ------
# The hooks below maintain @TMUX_CURR_PANE/@TMUX_PREV_PANE entirely
# in-server: pure format work, no run-shell, no subprocess, and tmux runs
# hooks synchronously in event order, so focus changes cost nothing and
# cannot race. pane-back.sh holds @TMUX_HIST_LOCK across its multi-step
# jump — the guard makes the hooks skip those events — and writes the
# authoritative pair itself. No hook reaps dead panes from history:
# pane-exited formats the SURVIVING pane, never the dying one, so stale
# entries are validated and dropped at jump time.
# Reloading applies what this file says; it cannot know what the file no
# longer says. tmux keeps hooks in the SERVER, and -a appends stack up on
# every source, so a hook deleted here would keep firing (and a renamed
# script would fire as "returned 127") until the server restarts. Clearing
# every hook this config has ever owned makes a reload mean exactly the
# lines below.
set-hook -gu after-select-pane
set-hook -gu after-split-window
set-hook -gu session-window-changed
set-hook -gu client-session-changed
set-hook -gu pane-exited
set-hook -gu session-closed
set-hook -gu session-created
set-hook -gu client-attached
# A jump that died between taking and releasing the lock would leave the
# hooks skipping every focus event; a reload must always start unlocked.
set -gu @TMUX_HIST_LOCK

# One guard, three events: record only real focus moves — lock free, not
# a floating popup, not the pane already current.
set-hook -g after-select-pane {
  if -F '#{&&:#{==:#{@TMUX_HIST_LOCK},},#{&&:#{!=:#{pane_floating},1},#{!=:#{pane_id},#{@TMUX_CURR_PANE}}}}' {
    set -gF @TMUX_PREV_PANE '#{@TMUX_CURR_PANE}'
    set -gF @TMUX_CURR_PANE '#{pane_id}'
  }
}
set-hook -g session-window-changed {
  if -F '#{&&:#{==:#{@TMUX_HIST_LOCK},},#{&&:#{!=:#{pane_floating},1},#{!=:#{pane_id},#{@TMUX_CURR_PANE}}}}' {
    set -gF @TMUX_PREV_PANE '#{@TMUX_CURR_PANE}'
    set -gF @TMUX_CURR_PANE '#{pane_id}'
  }
}
set-hook -g client-session-changed {
  if -F '#{&&:#{==:#{@TMUX_HIST_LOCK},},#{&&:#{!=:#{pane_floating},1},#{!=:#{pane_id},#{@TMUX_CURR_PANE}}}}' {
    set -gF @TMUX_PREV_PANE '#{@TMUX_CURR_PANE}'
    set -gF @TMUX_CURR_PANE '#{pane_id}'
  }
}
# Blocking on purpose: the back jump is ~4 in-server invocations (~30ms),
# and serializing here is what makes a rapid double press round-trip
# instead of reading the same PREV twice.
bind -n M-l run-shell '~/.config/tmux/scripts/pane-back.sh'

# ----- window navigation on the alt layer ------------------------------
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-q detach-client
bind-key -n M-n new-window

# ----- hygiene ---------------------------------------------------------
# A session-closed hook runs after tmux has destroyed the closing session's
# panes, so it cannot identify which PPID=1 process belonged to that session.
# Never turn that missing context into a machine-wide nvim kill.
