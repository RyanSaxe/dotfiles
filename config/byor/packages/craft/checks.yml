checks:
  - name: module-headers
    extensions:
      - py
      - pyi
      - ts
      - tsx
      - mts
      - cts
      - js
      - jsx
      - mjs
      - cjs
      - rs
      - go
      - lua
    run: python3 ~/.config/byor/scripts/check-module-headers.py
    gate: false
    tags:
      - craft
      - documentation
  - name: thin-docstrings
    extensions:
      - py
      - pyi
      - ts
      - tsx
